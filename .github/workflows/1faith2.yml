name: ✝️ Post Faith Engage Reel to Facebook

on:
  workflow_dispatch:
  schedule:
    # 5 posts a day. UTC times -> 8:07am / 12:07pm / 4:07pm / 8:07pm / 11:07pm Eastern
    #                           -> 5:07am / 9:07am / 1:07pm / 5:07pm / 8:07pm Pacific
    - cron: "0 12 * * *"

jobs:
  post:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu22-faith-v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            xvfb chromium-browser libnss3 libgbm1 libasound2 ffmpeg pulseaudio

      - name: Cache pip and ChromeDriver
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.wdm
          key: pip-wdm-faith-v7

      - name: Cache Piper binary and voice
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-binary-ryan-v5

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install selenium webdriver-manager requests edge-tts

      - name: Download Piper binary and voice (main voice if Edge is blocked)
        run: |
          mkdir -p ~/.cache/piper
          PIPER_BIN=~/.cache/piper/piper
          if [ ! -f "$PIPER_BIN" ]; then
            echo "Downloading Piper binary..."
            curl -L -o /tmp/piper.tar.gz \
              "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" || {
              echo "Piper download failed"
              exit 0
            }
            mkdir -p /tmp/piper_extract
            tar -xzf /tmp/piper.tar.gz -C /tmp/piper_extract
            FOUND=$(find /tmp/piper_extract -name "piper" -type f | head -1)
            if [ -n "$FOUND" ]; then
              # copy the WHOLE folder (binary + .so libs + espeak-ng-data)
              cp -r "$(dirname "$FOUND")"/. ~/.cache/piper/
              chmod +x "$PIPER_BIN"
              echo "Piper binary ready."
            else
              echo "Piper binary not found"
            fi
          else
            echo "Piper binary already cached."
          fi
          VOICE_FILE=~/.cache/piper/en_US-ryan-medium.onnx
          if [ ! -f "$VOICE_FILE" ]; then
            curl -L -o "$VOICE_FILE" \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium/en_US-ryan-medium.onnx" || true
            curl -L -o "${VOICE_FILE}.json" \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium/en_US-ryan-medium.onnx.json" || true
          fi
          ls -la ~/.cache/piper | head -20

      - name: Set timestamp
        run: echo "TS=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Start virtual display and audio
        run: |
          Xvfb :99 -screen 0 540x960x24 -ac &
          pulseaudio --start --exit-idle-time=-1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 3

      - name: Record and Post to Facebook
        run: |
          python3 << 'PYEOF'
          import os, time, subprocess, random, requests, base64, glob, re, tempfile, asyncio
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager

          MUSIC_EXTENSIONS = ["mp3","wav","m4a","mp4","aac","ogg","flac","wma","opus"]
          PIPER_BIN   = str(Path.home() / ".cache/piper/piper")
          PIPER_VOICE = str(Path.home() / ".cache/piper/en_US-ryan-medium.onnx")
          EDGE_VOICE  = "en-US-AndrewNeural"   # alt deeper voice: en-US-GuyNeural
          REC_SECONDS = 26                     # max recording length; trimmed to voice length later

          ORDINAL_BOOKS = {"1 ":"First ","2 ":"Second ","3 ":"Third "}

          def clean_for_tts(text):
            if not text: return text
            # strip emojis and invisible joiners so they are never read aloud
            text=re.sub(r'[\U0001F000-\U0001FAFF\u2600-\u27BF\u2B00-\u2BFF\uFE0F\u200D]+','',text)
            for p,r in ORDINAL_BOOKS.items():
              text=re.sub(r'\b'+re.escape(p),r,text)
            text=re.sub(r'(\b[A-Za-z]+\s+)(\d+):(\d+)',lambda m:f"{m.group(1)}chapter {m.group(2)} verse {m.group(3)}",text)
            text=re.sub(r'\b(\d+):(\d+)\b',r'chapter \1 verse \2',text)
            text=re.sub(r'(\d),(\d)',r'\1\2',text)
            text=text.replace('\u2014',', ').replace('\u2013',', ')
            text=text.replace('*','').replace('#','').replace('_','')
            text=re.sub(r'\s+',' ',text).strip()
            return text

          def make_silence(dur,path,sr=24000):
            subprocess.run(["ffmpeg","-y","-f","lavfi","-i",f"anullsrc=r={sr}:cl=mono","-t",str(dur),"-acodec","pcm_s16le",path],capture_output=True)

          def normalize(wav, target=-15.0):
            # trim leading silence, measure average loudness, apply exact gain so every clip matches
            # target: higher (e.g. -13) = louder, lower (e.g. -19) = quieter
            tmp=wav+".n.wav"
            trim="silenceremove=start_periods=1:start_threshold=-50dB:start_silence=0.05"
            p=subprocess.run(["ffmpeg","-hide_banner","-i",wav,"-af",trim+",volumedetect","-f","null","-"],capture_output=True,text=True)
            m=re.search(r"mean_volume:\s*(-?[\d.]+) dB",p.stderr)
            if not m:
              print("  (normalize: could not measure, left as is)"); return
            gain=max(-20.0,min(20.0,target-float(m.group(1))))
            r=subprocess.run(["ffmpeg","-y","-i",wav,"-af",f"{trim},volume={gain:.1f}dB,alimiter=limit=0.95","-ar","24000","-ac","1","-acodec","pcm_s16le",tmp],capture_output=True)
            if r.returncode==0 and Path(tmp).exists():
              os.replace(tmp,wav); print(f"  (volume matched, gain {gain:+.1f} dB)")

          def audio_duration(path):
            p=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0",path],capture_output=True,text=True)
            try: return float(p.stdout.strip())
            except: return 0.0

          # Edge is tried once per run; if GitHub's IP is blocked (403) we switch to Piper for the rest
          EDGE_BLOCKED = False

          async def edge_async(text,out_mp3):
            try:
              import edge_tts
              comm=edge_tts.Communicate(text,EDGE_VOICE,rate="-5%",pitch="+0Hz")
              await comm.save(out_mp3)
              return Path(out_mp3).exists() and Path(out_mp3).stat().st_size>100
            except Exception as e:
              print(f"  Edge error: {str(e)[:120]}"); return False

          def edge_speak(text,out_wav):
            mp3=out_wav.replace(".wav","_e.mp3")
            if not asyncio.run(edge_async(text,mp3)): return False
            r=subprocess.run(["ffmpeg","-y","-i",mp3,"-acodec","pcm_s16le","-ar","24000","-ac","1",out_wav],capture_output=True)
            try: os.remove(mp3)
            except: pass
            return r.returncode==0 and Path(out_wav).exists() and Path(out_wav).stat().st_size>100

          def piper_speak(text,out_wav):
            if not Path(PIPER_BIN).exists():
              print("  Piper binary missing"); return False
            if not Path(PIPER_VOICE).exists():
              print("  Piper voice missing"); return False
            try:
              env=os.environ.copy()
              env["LD_LIBRARY_PATH"]=str(Path.home()/".cache/piper")+":"+env.get("LD_LIBRARY_PATH","")
              r=subprocess.run([PIPER_BIN,"--model",PIPER_VOICE,"--output_file",out_wav],input=text.encode(),capture_output=True,timeout=60,env=env,cwd=str(Path.home()/".cache/piper"))
              if r.returncode!=0:
                print(f"  Piper exit {r.returncode}: {r.stderr.decode(errors='ignore')[-300:]}")
              return r.returncode==0 and Path(out_wav).exists() and Path(out_wav).stat().st_size>100
            except Exception as e:
              print(f"  Piper error: {e}"); return False

          def synthesise(text,out_wav):
            global EDGE_BLOCKED
            text=clean_for_tts(text)
            if not text: return False
            print(f"  TTS: '{text[:70]}...'" if len(text)>70 else f"  TTS: '{text}'")
            if not EDGE_BLOCKED:
              if edge_speak(text,out_wav): normalize(out_wav); print("  -> Edge OK"); return True
              EDGE_BLOCKED=True
              print("  -> Edge failed, using Piper for the rest of this run")
            if piper_speak(text,out_wav): normalize(out_wav); print("  -> Piper OK"); return True
            print("  -> Both failed"); return False

          def concat_wavs(wavs,out):
            if not wavs: return False
            if len(wavs)==1: subprocess.run(["cp",wavs[0],out]); return True
            lst=out+".txt"
            with open(lst,"w") as f:
              for w in wavs: f.write(f"file '{w}'\n")
            r=subprocess.run(["ffmpeg","-y","-f","concat","-safe","0","-i",lst,"-acodec","pcm_s16le",out],capture_output=True)
            try: os.remove(lst)
            except: pass
            return r.returncode==0 and Path(out).exists()

          def build_tts(headline,subtitle,ref,engage,tmp):
            segs=[]; ok=False
            h=os.path.join(tmp,"h.wav")
            if synthesise(headline,h):
              segs.append(h); ok=True
              s=os.path.join(tmp,"s1.wav"); make_silence(0.65,s); segs.append(s)
            if subtitle:
              sw=os.path.join(tmp,"s.wav")
              if synthesise(subtitle,sw):
                segs.append(sw); ok=True
                s=os.path.join(tmp,"s2.wav"); make_silence(0.85,s); segs.append(s)
            if ref:
              rw=os.path.join(tmp,"r.wav")
              if synthesise(ref,rw):
                segs.append(rw); ok=True
                s=os.path.join(tmp,"s3.wav"); make_silence(1.0,s); segs.append(s)
            if engage:
              s=os.path.join(tmp,"s4.wav"); make_silence(1.2,s); segs.append(s)
              ew=os.path.join(tmp,"e.wav")
              if synthesise(engage,ew):
                segs.append(ew); ok=True
            if not ok or not segs: return None
            out=os.path.join(tmp,"final.wav")
            return out if concat_wavs(segs,out) else None

          def pick_music():
            candidates=[]
            for entry in os.scandir("."):
              if entry.is_dir() and entry.name.lower().startswith("bgmusic"):
                for ext in MUSIC_EXTENSIONS:
                  candidates.extend(glob.glob(os.path.join(entry.path,f"*.{ext}")))
                  candidates.extend(glob.glob(os.path.join(entry.path,f"*.{ext.upper()}")))
            if candidates:
              chosen=random.choice(candidates); print(f"Music: {chosen}"); return chosen
            print("No bgmusic folder found."); return None

          def music_start(path,need):
            d=audio_duration(path)
            return random.uniform(0,max(0,d-need)) if d>need+3 else 0

          # ── SELENIUM ──────────────────────────────────
          ts         = os.environ.get("TS","test")
          webm_file  = f"/tmp/engage_{ts}.webm"
          mp4_file   = f"/tmp/engage_{ts}.mp4"
          html_path  = os.path.abspath("faith_engage.html")
          fb_token   = os.environ.get("FB_PAGE_TOKEN")
          fb_page_id = os.environ.get("FB_PAGE_ID")

          if not fb_token or not fb_page_id:
            raise RuntimeError("FB_PAGE_TOKEN or FB_PAGE_ID secret is missing")

          opts=Options()
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=540,960")
          opts.add_argument("--window-position=0,0")
          opts.add_argument("--force-device-scale-factor=1")
          opts.add_argument("--autoplay-policy=no-user-gesture-required")
          opts.add_argument("--disable-background-timer-throttling")
          opts.add_argument("--disable-renderer-backgrounding")
          opts.add_argument("--disable-backgrounding-occluded-windows")
          opts.add_argument("--no-first-run")
          opts.add_argument("--disable-infobars")
          opts.add_argument("--disable-notifications")
          opts.add_argument("--use-fake-ui-for-media-stream")
          opts.add_argument("--use-fake-device-for-media-stream")
          opts.add_argument("--allow-file-access-from-files")
          opts.add_experimental_option("excludeSwitches",["enable-automation"])
          opts.add_experimental_option("useAutomationExtension",False)
          opts.add_experimental_option("mobileEmulation",{
            "deviceMetrics":{"width":540,"height":960,"pixelRatio":1.0},
            "userAgent":"Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
          })

          print("Starting Chrome...")
          driver=webdriver.Chrome(service=Service(ChromeDriverManager().install()),options=opts)
          driver.set_window_size(540,960)
          driver.set_script_timeout(120)
          driver.get(f"file://{html_path}")
          time.sleep(3)

          driver.execute_script("""
            document.body.click();
            if(typeof AC!=='undefined') AC.resume();
            window.startRecordingFreshScene(30);
          """)
          print(f"Recording {REC_SECONDS} seconds...")
          time.sleep(REC_SECONDS)

          driver.execute_script("window.stopRecording();")
          time.sleep(1)
          driver.execute_script("window.forceFinalize();")
          time.sleep(1)

          for _ in range(30):
            if driver.execute_script("return window._recordingDone;"): print("Recording finalised."); break
            time.sleep(0.4)
          else:
            driver.quit(); raise RuntimeError("Recording failed to finalise")

          b64=driver.execute_async_script("""
            var done=arguments[0];
            window.getRecordingBase64().then(done).catch(function(e){done(null);});
          """)
          data=driver.execute_script("""
            return {
              category: window._lastCategory||'verse',
              headline: window._lastHeadline||'',
              subtitle: window._lastSubtitle||'',
              ref:      window._lastRef||'',
              engage:   window._lastEngage||''
            };
          """)
          category    =data.get('category','verse')
          tts_headline=data.get('headline','')
          tts_subtitle=data.get('subtitle','')
          tts_ref     =data.get('ref','')
          tts_engage  =data.get('engage','')
          print(f"Type: {category} | {tts_headline[:50]}")
          driver.quit()

          if not b64: raise RuntimeError("Failed to get base64 data")
          with open(webm_file,'wb') as f: f.write(base64.b64decode(b64))
          print(f"WebM: {os.path.getsize(webm_file)/1024/1024:.1f} MB")

          print("Converting to MP4...")
          t0=time.time()
          r=subprocess.run([
            "ffmpeg","-y","-i",webm_file,
            "-c:v","libx264","-preset","medium","-crf","20","-r","30",
            "-pix_fmt","yuv420p","-vf","scale=1080:1920:flags=lanczos",
            "-c:a","aac","-b:a","192k","-ar","48000",
            "-movflags","+faststart",mp4_file
          ],capture_output=True,text=True)
          if not os.path.exists(mp4_file) or os.path.getsize(mp4_file)<10000:
            raise RuntimeError(f"MP4 failed: {r.stderr[-500:]}")
          os.remove(webm_file)
          print(f"MP4: {os.path.getsize(mp4_file)/1024/1024:.1f} MB in {time.time()-t0:.0f}s")

          # ── TTS ───────────────────────────────────────
          tts_wav=None
          with tempfile.TemporaryDirectory() as tmp:
            print("Building TTS...")
            if tts_headline:
              wav=build_tts(tts_headline,tts_subtitle,tts_ref,tts_engage,tmp)
              if wav:
                mp3=f"/tmp/engage_{ts}_tts.mp3"
                c=subprocess.run(["ffmpeg","-y","-i",wav,"-ar","44100","-ac","1","-b:a","128k",mp3],capture_output=True)
                if c.returncode==0 and Path(mp3).exists():
                  tts_wav=mp3; print(f"TTS ready: {Path(mp3).stat().st_size//1024} KB")
                else: print("TTS mp3 failed")
            else: print("No headline — skipping TTS")

          # never post a video without a voice
          if not tts_wav:
            raise RuntimeError("TTS failed (Edge and Piper) - not posting a silent video")

          # ── FINAL LENGTH ──────────────────────────────
          video_dur=audio_duration(mp4_file) or float(REC_SECONDS)
          voice_dur=audio_duration(tts_wav)
          final_len=min(video_dur-0.3, voice_dur+1.2+1.5)   # 1.2s voice delay + 1.5s tail
          final_len=max(final_len,6.0)
          print(f"Final length: {final_len:.1f}s (video {video_dur:.1f}s, voice {voice_dur:.1f}s)")
          fade_out_st=max(0,final_len-2)

          # ── MUSIC + MIX ───────────────────────────────
          music_file=pick_music()
          mixed_file=f"/tmp/engage_{ts}_final.mp4"
          mix_ok=False

          if music_file:
            print("Mixing voice + music...")
            ms=music_start(music_file,final_len+2)
            # every input is padded (apad) so amix keeps a constant input count
            # -> voice level stays the same from start to end; volume=3 compensates amix's 1/3 scaling
            mix=subprocess.run([
              "ffmpeg","-y",
              "-i",mp4_file,
              "-ss",str(ms),"-t",str(final_len+1),"-i",music_file,
              "-i",tts_wav,
              "-filter_complex",
              f"[1:a]volume=0.35,afade=t=in:st=0:d=1.5,afade=t=out:st={fade_out_st}:d=2,apad[music];"
              "[2:a]adelay=1200|1200,afade=t=in:st=0:d=0.3,apad[voice];"
              "[0:a]volume=0.06,apad[orig];"
              "[voice][music][orig]amix=inputs=3:duration=longest:dropout_transition=0,volume=3[aout]",
              "-map","0:v","-map","[aout]",
              "-t",str(final_len),
              "-c:v","copy","-c:a","aac","-b:a","256k",
              "-movflags","+faststart",mixed_file
            ],capture_output=True,text=True)
          else:
            print("Voice only...")
            mix=subprocess.run([
              "ffmpeg","-y","-i",mp4_file,"-i",tts_wav,
              "-filter_complex",
              "[1:a]adelay=1200|1200,afade=t=in:st=0:d=0.3,apad[voice];"
              "[0:a]volume=0.06,apad[orig];"
              "[voice][orig]amix=inputs=2:duration=longest:dropout_transition=0,volume=2[aout]",
              "-map","0:v","-map","[aout]",
              "-t",str(final_len),
              "-c:v","copy","-c:a","aac","-b:a","256k",
              "-movflags","+faststart",mixed_file
            ],capture_output=True,text=True)

          mix_ok=os.path.exists(mixed_file) and os.path.getsize(mixed_file)>10000
          print("Mix done." if mix_ok else f"Mix failed: {mix.stderr[-400:]}")
          if not mix_ok:
            raise RuntimeError("Mix failed - not posting a video without the voice")

          final_mp4=mixed_file
          try: os.remove(tts_wav)
          except: pass

          # ── CAPTIONS ──────────────────────────────────
          CAPTIONS={
            "verse":[
              "Save this if you needed it today. #Faith #Christian #Bible #Hope",
              "Someone needed to see this right now. #Jesus #Faith #Hope #Christian",
              "Share this with someone going through something hard. #Faith #Hope #Christian",
            ],
            "declaration":[
              "Say it out loud and mean it. Tag someone who needs this. #Faith #Declaration #Christian",
              "Speak this over your day. #Faith #Christian #Jesus #Hope",
              "Tag someone who needs to declare this today. #Faith #Christian #Hope",
            ],
            "wwjd":[
              "What would Jesus do? Drop your thoughts in the comments. #WWJD #Faith #Christian #Jesus",
              "This is a real situation. What do you think Jesus would do? Comment below. #WWJD #Christian #Faith",
              "We want to hear your thoughts. Comment what you think Jesus would do. #WWJD #Faith #Jesus",
            ],
            "blank":[
              "Drop your answer in the comments. #Faith #Christian #Bible #Hope",
              "What is your answer? Comment below. #Faith #Christian #Jesus",
              "Everyone has a different answer. Share yours. #Faith #Christian #Bible",
            ],
            "didyouknow":[
              "Did you know this? Share it with someone who loves the Bible. #DidYouKnow #Bible #Christian #Faith",
              "Share this with a fellow believer. #Bible #Christian #Faith #DidYouKnow",
              "This one surprised us. Share it. #Bible #Christian #Faith #DidYouKnow",
            ],
            "encourage":[
              "You are not alone in this. Share this with someone who needs it today. #Faith #Christian #Hope #Jesus",
              "He sees what you are carrying. Save this for when you need the reminder. #Hope #Faith #Christian",
              "Tag someone who needs to hear this right now. #Faith #Hope #Christian #Jesus",
              "Share this with someone going through a hard season. #Faith #Hope #Christian #God",
            ],
            "askverse":[
              "What verse gets you through? Type it in the comments so others can save it. #Bible #Faith #Christian #Verse",
              "Share your favorite verse below. Someone needs it today. #Faith #Bible #Christian #Hope",
              "Drop a verse in the comments for someone who is hurting. #Faith #Bible #Jesus #Christian",
            ],
          }
          description=random.choice(CAPTIONS.get(category,CAPTIONS["verse"]))

          print("Posting to Facebook...")
          with open(final_mp4,'rb') as f:
            response=requests.post(
              f"https://graph-video.facebook.com/v18.0/{fb_page_id}/videos",
              data={"description":description,"access_token":fb_token},
              files={"source":(os.path.basename(final_mp4),f,"video/mp4")}
            )
          print(f"Response: {response.status_code}")
          if response.status_code==200:
            print(f"Posted! ID: {response.json().get('id')}")
          else:
            raise RuntimeError(f"Post failed: {response.text}")

          for f in [mp4_file,mixed_file]:
            try:
              if os.path.exists(f): os.remove(f)
            except: pass
          print("Done!")
          PYEOF
        env:
          TS:            ${{ env.TS }}
          DISPLAY:       ":99"
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}