              ("b6", "In the world you have trouble; but cheer up! I have ___ the world.", ["overcome", "left", "seen"], 0, "John 16:33"),
              ("b7", "His compassions don't fail. They are new every ___.", ["morning", "week", "year"], 0, "Lamentations 3:23"),
              ("b8", "He heals the broken in heart, and binds up their ___.", ["wounds", "hands", "chains"], 0, "Psalm 147:3"),
              ("b9", "But those who wait for the LORD will renew their ___.", ["strength", "hope", "faith"], 0, "Isaiah 40:31"),
              ("b10", "Behold, I am with you ___, even to the end of the age.", ["always", "sometimes", "rarely"], 0, "Matthew 28:20"),
              ("b11", "I can do all things through Christ who ___ me.", ["strengthens", "loves", "finds"], 0, "Philippians 4:13"),
              ("b12", "Be still, and know that I am ___.", ["God", "here", "near"], 0, "Psalm 46:10"),
              ("b13", "Cast your burden on the LORD, and he will ___ you.", ["sustain", "teach", "leave"], 0, "Psalm 55:22"),
              ("b14", "Draw near to God, and he will draw near to ___.", ["you", "us", "them"], 0, "James 4:8"),
              ("b15", "Don't be afraid, for I have redeemed you. I have called you by your ___.", ["name", "side", "word"], 0, "Isaiah 43:1"),
              ("b16", "Wait for the LORD. Be strong, and let your heart take ___.", ["courage", "rest", "cover"], 0, "Psalm 27:14"),
              ("b17", "Bear one another's ___, and so fulfill the law of Christ.", ["burdens", "stories", "gifts"], 0, "Galatians 6:2"),
              ("b18", "Jesus Christ is the same yesterday, today, and ___.", ["forever", "soon", "again"], 0, "Hebrews 13:8"),
              ("b19", "Trust in him at all times, you people. Pour out your ___ before him.", ["heart", "list", "plans"], 0, "Psalm 62:8"),
              ("b20", "Therefore if anyone is in Christ, he is a new ___.", ["creation", "beginning", "day"], 0, "2 Corinthians 5:17"),
              ("b21", "My grace is sufficient for you, for my power is made perfect in ___.", ["weakness", "strength", "love"], 0, "2 Corinthians 12:9"),
              ("b22", "Allow the little ___ to come to me, and don't forbid them.", ["children", "people", "sheep"], 0, "Mark 10:14"),
              ("b23", "Even though I walk through the valley of the shadow of death, I will fear no ___.", ["evil", "man", "storm"], 0, "Psalm 23:4"),
              ("b24", "Let not your heart be ___, neither let it be fearful.", ["troubled", "hardened", "silent"], 0, "John 14:27"),
              ("b25", "He who began a good work in you will ___ it until the day of Jesus Christ.", ["complete", "start", "test"], 0, "Philippians 1:6"),
              ("b26", "The LORD is my shepherd; I shall not ___.", ["want", "fear", "fall"], 0, "Psalm 23:1"),
              ("b27", "Rejoice always. Pray without ceasing. In everything give ___.", ["thanks", "praise", "up"], 0, "1 Thessalonians 5:16-18"),
              ("b28", "Love is patient and is ___.", ["kind", "strong", "quiet"], 0, "1 Corinthians 13:4"),
              ("b29", "Trust in the LORD with all your ___.", ["heart", "mind", "strength"], 0, "Proverbs 3:5"),
              ("b30", "For God so loved the world, that he gave his only born ___.", ["Son", "gift", "life"], 0, "John 3:16"),
          ]

          POOLS = {"understands": UNDERSTANDS, "hold_on": HOLD_ON, "season_poll": POLLS, "verse_blank": BLANKS}
          TYPES = list(POOLS)

          # ================================================================== PICK
          USED_FILE = "used.json"
          used = json.load(open(USED_FILE)) if os.path.exists(USED_FILE) else {}
          game = os.environ.get("GAME", "auto")
          if game not in TYPES:
              game = random.choices(TYPES, [4, 3, 1, 2])[0]
          pool = POOLS[game]
          ug = used.get(game, [])
          cands = [p for p in pool if p[0] not in ug]
          if not cands:
              ug = []
              cands = pool
          puz = random.choice(cands)
          used[game] = ug + [puz[0]]
          print("Post type:", game, "| Item:", puz[0])

          # ================================================================== SPRITES
          COLORS = ["#FF5A5F", "#FFB400", "#00B8A9", "#7C4DFF", "#FF7A00", "#2EA8F1", "#FF4D9D", "#4CAF50"]
          PALETTES = [("#1B2A49", "#8E5572", "#F2A65A"), ("#0F2027", "#2C5364", "#E8A87C"),
                      ("#2D1B69", "#6A4C93", "#FFB88C"), ("#14213D", "#4A6FA5", "#FCA311")]
          WHITE, GOLD = "white", "#FFE9A8"


          def block(text, size, color, fp, maxw=940, panel=False):
              f = font(fp, size)
              lines, cur = [], ""
              for w in text.split():
                  tr = (cur + " " + w).strip()
                  if cur and M.textlength(tr, font=f) > maxw:
                      lines.append(cur)
                      cur = w
                  else:
                      cur = tr
              if cur:
                  lines.append(cur)
              lh = int(size * 1.4)
              w, h = maxw + 80, lh * len(lines) + 40
              im = Image.new("RGBA", (w, h), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              if panel:
                  d.rounded_rectangle([0, 0, w - 1, h - 1], radius=40, fill=(20, 10, 50, 130))
              for i, l in enumerate(lines):
                  cy = 20 + lh * i + lh / 2
                  d.text((w / 2 + 3, cy + 4), l, font=f, fill=(0, 0, 0, 90), anchor="mm")
                  d.text((w / 2, cy), l, font=f, fill=color, anchor="mm", stroke_width=4, stroke_fill=(40, 20, 70, 255))
              return im


          def pill(text, size, color, minw=0):
              f = font(F_SANS, size)
              tw = M.textlength(text, font=f)
              h = int(size * 1.7)
              w = max(int(tw + size * 1.2), minw)
              pad = 16
              im = Image.new("RGBA", (w + 2 * pad, h + 2 * pad), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([pad + 5, pad + 9, pad + w + 5, pad + h + 9], radius=h // 2, fill=(0, 0, 0, 80))
              d.rounded_rectangle([pad, pad, pad + w, pad + h], radius=h // 2, fill=hexrgb(color) + (255,),
                                  outline=(255, 255, 255, 255), width=5)
              d.text((pad + w / 2, pad + h / 2), text, font=f, fill="white", anchor="mm", stroke_width=3, stroke_fill=(0, 0, 0, 90))
              return im


          def cross():
              im = Image.new("RGBA", (150, 200), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([57, 15, 93, 185], radius=8, fill=(255, 233, 168, 255))
              d.rounded_rectangle([20, 60, 130, 96], radius=8, fill=(255, 233, 168, 255))
              return im


          def S(items, speech, hold=0.0):
              return dict(items=items, speech=speech, hold=hold)


          def verse_slide(verse, ref):
              return S([block(verse, 58, WHITE, F_SERIF, panel=True), pill(ref, 48, "#FF7A00")], verse + " " + refs(ref))


          # ================================================================== SLIDES
          if game == "understands":
              _, hook, went, so, verse, ref, q = puz
              title = "HE'S BEEN THERE"
              slides = [
                  S([block(hook, 88, WHITE, F_SANS)], hook),
                  S([block(went, 60, GOLD, F_SANS)], went),
                  S([block(so, 64, WHITE, F_SANS)], so),
                  verse_slide(verse, ref),
                  S([block(q, 62, GOLD, F_SANS), pill("Share below", 52, "#FF3D71")], q),
              ]
              caption_top, caption_q = hook, q
              comment = f"{ref} (WEB)\n\"{verse}\"\n\n{q}"

          elif game == "hold_on":
              _, hook, lines, verse, ref, q = puz
              title = "HOLD ON"
              slides = [
                  S([block(hook, 92, WHITE, F_SANS)], hook),
                  S([block(l, 64, GOLD if i == 0 else WHITE, F_SANS) for i, l in enumerate(lines)], " ".join(lines)),
                  verse_slide(verse, ref),
                  S([block(q, 62, GOLD, F_SANS), pill("Share below", 52, "#FF3D71")], q),
              ]
              caption_top, caption_q = hook, q
              comment = f"{ref} (WEB)\n\"{verse}\"\n\n{q}"

          elif game == "season_poll":
              _, title, q, opts, reply = puz
              spoken = " ".join(f"{i + 1}, {o}." for i, o in enumerate(opts))
              slides = [
                  S([block(q, 84, WHITE, F_SANS)], q),
                  S([pill(f"{i + 1})  {o}", 58, COLORS[i], minw=760) for i, o in enumerate(opts)],
                    "Comment the number that fits you. " + spoken, hold=2.0),
                  S([block("Tell us your number", 72, GOLD, F_SANS), pill("You are not alone", 56, "#FF3D71")],
                    "Tell us your number in the comments. You are not alone."),
              ]
              caption_top, caption_q = q, "Comment your number below."
              comment = reply

          else:  # verse_blank
              _, text, opts, ci, ref = puz
              correct = opts[ci]
              opts = opts[:]
              random.shuffle(opts)
              ci = opts.index(correct)
              title = "FINISH THE VERSE"
              spoken_opts = " ".join(f"{'ABC'[i]}, {o}." for i, o in enumerate(opts))
              slides = [
                  S([block("Can you finish this verse?", 84, WHITE, F_SANS)], "Can you finish this verse?"),
                  S([block(text.replace("___", "_____"), 58, WHITE, F_SERIF, panel=True)] +
                    [pill(f"{'ABC'[i]})  {o}", 56, COLORS[i], minw=620) for i, o in enumerate(opts)],
                    text.replace("___", "blank") + " " + spoken_opts, hold=3.0),
                  S([block("Answer A, B or C below", 70, GOLD, F_SANS), pill("No peeking", 52, "#FF3D71")],
                    "Type your answer in the comments."),
              ]
              caption_top, caption_q = "Can you finish this verse?", "Comment A, B or C below."
              full = text.replace("___", correct)
              comment = (f"Answer: {'ABC'[ci]}) {correct}\n\n\"{full}\" ({ref}, WEB)\n\n"
                         f"Which verse is carrying you right now? Share it below.")


          # ================================================================== TTS
          def tts(text, out):
              for _ in range(3):
                  try:
                      subprocess.run(["edge-tts", "--voice", VOICE, "--rate=-4%", "--text", text, "--write-media", out],
                                     capture_output=True, timeout=90)
                  except Exception:
                      pass
                  if os.path.exists(out) and os.path.getsize(out) > 0:
                      return True
              return False


          def load(path):
              raw = subprocess.run(["ffmpeg", "-v", "error", "-i", path, "-f", "f32le", "-ac", "1", "-ar", str(SR), "-"],
                                   capture_output=True, check=True).stdout
              return np.frombuffer(raw, dtype=np.float32).copy()


          for i, s in enumerate(slides):
              clean = sanitize(s["speech"])
              out = f"/tmp/s{i}.mp3"
              if tts(clean, out):
                  arr = load(out)
                  arr = arr / (float(np.max(np.abs(arr))) or 1.0) * 0.9
              else:
                  print("TTS failed for slide", i)
                  arr = np.zeros(int(SR * max(2.0, len(clean.split()) * 0.45)), dtype=np.float32)
              s["audio"] = arr
              s["dur"] = len(arr) / SR

          # ================================================================== TIMELINE + ELEMENTS
          els, pops, starts = [], [], []


          def add(im, cx, cy, a, b=None, bounce=True, ph=0.0):
              els.append(dict(im=im, cx=cx, cy=cy, a=a, b=b, bounce=bounce, ph=ph))


          add(cross(), W / 2, 130, 0.2, bounce=False)
          add(block(title, 64, GOLD, F_SANS, maxw=960), W / 2, 270, 0.3, bounce=False)

          cursor = 0.5
          for i, s in enumerate(slides):
              last = i == len(slides) - 1
              sdur = max(2.8, s["dur"] + 0.9 + s["hold"])
              start, end = cursor, cursor + sdur
              starts.append(start)
              items = s["items"]
              n, gap = len(items), 24
              total = sum(im.height for im in items) + gap * (n - 1)
              y = max(400, 960 - total / 2 + 30)
              stagger = max(0.3, min(1.3, (s["dur"] - 0.2) / max(1, n)))
              for j, im in enumerate(items):
                  a = start + 0.15 + j * stagger
                  add(im, W / 2, y + im.height / 2, a, None if last else end, ph=j * 0.8)
                  pops.append(a)
                  y += im.height + gap
              cursor = end
          TOTAL = cursor + 1.0
          print(f"Total length: {TOTAL:.1f}s")

          # ================================================================== BACKGROUND
          pal = [hexrgb(c) for c in random.choice(PALETTES)]
          ys = (np.arange(2 * H) % H) / H * 3
          idx = np.floor(ys).astype(int)
          fr = (ys - idx)[:, None]
          cols = np.array(pal, dtype=np.float32)
          grad = cols[idx] * (1 - fr) + cols[(idx + 1) % 3] * fr
          bg = Image.fromarray(np.repeat(grad[:, None, :], W, axis=1).astype(np.uint8))

          rng = random.Random(7)
          bokeh = []
          for i in range(9):
              r = rng.randint(70, 200)
              im = Image.new("RGBA", (2 * r, 2 * r), (0, 0, 0, 0))
              ImageDraw.Draw(im).ellipse([0, 0, 2 * r - 1, 2 * r - 1], fill=(255, 255, 255, rng.randint(20, 45)))
              bokeh.append((im, rng.randint(0, W), rng.randint(0, H), rng.uniform(15, 45), rng.uniform(0, 6)))


          def ease_back(x):
              if x <= 0:
                  return 0.0
              if x >= 1:
                  return 1.0
              c1 = 1.70158
              c3 = c1 + 1
              return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2


          def put(frame, im, cx, cy, s=1.0):
              if s <= 0.02:
                  return
              if abs(s - 1) > 0.005:
                  im = im.resize((max(1, int(im.width * s)), max(1, int(im.height * s))), Image.BILINEAR)
              frame.paste(im, (int(cx - im.width / 2), int(cy - im.height / 2)), im)


          def render(t):
              off = int(t * 60) % H
              img = bg.crop((0, off, W, off + H))
              for im, bx, by, sp, ph in bokeh:
                  put(img, im, bx + math.sin(t * 0.5 + ph) * 50, (by - t * sp) % (H + 400) - 200)
              for e in els:
                  if t < e["a"]:
                      continue
                  s = ease_back((t - e["a"]) / 0.4)
                  active = True
                  if e["b"] is not None and t > e["b"]:
                      s = max(0.0, 1 - (t - e["b"]) / 0.25)
                      active = False
                      if s <= 0:
                          continue
                  dy = math.sin((t - e["a"]) * 3 + e["ph"]) * 5 if (e["bounce"] and active) else 0
                  put(img, e["im"], e["cx"], e["cy"] + dy, s)
              return img


          # ================================================================== AUDIO
          buf = np.zeros(int((TOTAL + 0.5) * SR), dtype=np.float32)


          def tone(freq, d_, vol, decay):
              t = np.arange(int(SR * d_)) / SR
              return (np.sin(2 * np.pi * freq * t) * np.exp(-decay * t) * vol).astype(np.float32)


          snd_pop = tone(660, 0.12, 0.35, 25) + tone(990, 0.12, 0.18, 25)
          snd_chime = tone(1046, 0.9, 0.3, 4) + tone(1568, 0.9, 0.18, 4)
          nz = int(SR * 0.35)
          snd_whoosh = (np.random.randn(nz) * (np.sin(np.linspace(0, np.pi, nz)) ** 2) * 0.08).astype(np.float32)


          def mix(snd, t, gain=1.0):
              i = int(t * SR)
              n = min(len(snd), len(buf) - i)
              if n > 0 and i >= 0:
                  buf[i:i + n] += snd[:n] * gain


          for a in pops:
              mix(snd_pop, a)
          for i, s in enumerate(slides):
              mix(snd_whoosh, starts[i] - 0.05)
              mix(s["audio"], starts[i] + 0.2)
          mix(snd_chime, starts[-1])

          tracks = [p for e in ("mp3", "wav", "m4a", "aac", "ogg", "flac", "mp4") for p in glob.glob(f"bgmusic/*.{e}")]
          if tracks:
              try:
                  mp = random.choice(tracks)
                  dd = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", mp],
                                      capture_output=True, text=True).stdout.strip()
                  mdur = float(dd) if dd else 0
                  ms = random.uniform(0, mdur - TOTAL - 2) if mdur > TOTAL + 4 else 0
                  raw = subprocess.run(["ffmpeg", "-v", "error", "-stream_loop", "-1", "-ss", f"{ms:.1f}", "-t", f"{TOTAL:.1f}",
                                        "-i", mp, "-f", "f32le", "-ac", "1", "-ar", str(SR), "-"], capture_output=True).stdout
                  m = np.frombuffer(raw, dtype=np.float32)
                  n = min(len(m), len(buf))
                  env = np.ones(n, dtype=np.float32)
                  fi, fo = int(SR * 0.8), int(SR * 1.5)
                  if n > fi + fo:
                      env[:fi] = np.linspace(0, 1, fi)
                      env[-fo:] = np.linspace(1, 0, fo)
                  buf[:n] += m[:n] * env * 0.15
              except Exception as ex:
                  print("music failed:", ex)

          buf = np.clip(buf * 0.9, -1, 1)
          with wave.open("audio.wav", "wb") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(SR)
              wf.writeframes((buf * 32767).astype(np.int16).tobytes())

          # ================================================================== RENDER
          ff = subprocess.Popen(["ffmpeg", "-v", "error", "-y", "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", f"{W}x{H}",
                                 "-r", str(FPS), "-i", "-", "-i", "audio.wav", "-c:v", "libx264", "-preset", "veryfast",
                                 "-crf", "20", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k", "-ac", "2",
                                 "-t", f"{TOTAL:.2f}", "-movflags", "+faststart", "final.mp4"], stdin=subprocess.PIPE)
          for k in range(int(TOTAL * FPS)):
              ff.stdin.write(render(k / FPS).tobytes())
          ff.stdin.close()
          ff.wait()

          # ================================================================== TEXT OUTPUTS
          caption = f"{caption_top}\n\n{caption_q}\n\n#Jesus #Faith #Encouragement #Bible #Hope"
          open("caption.txt", "w", encoding="utf-8").write(caption)
          open("comment.txt", "w", encoding="utf-8").write(comment)
          json.dump(used, open(USED_FILE, "w"), ensure_ascii=False, indent=1)
          print("Done.")
          PYEOF

          python3 game.py
          ls -lh final.mp4

      - name: post-reel
        if: ${{ always() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          API="https://graph.facebook.com/v19.0"
          SIZE=$(stat -c%s final.mp4)
          POST_ID=""; VID=""
          for attempt in 1 2 3; do
            INIT=$(curl -s -X POST "$API/$PAGE_ID/video_reels" -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$PAGE_TOKEN" '{upload_phase:"start",access_token:$t}')")
            VID=$(echo "$INIT" | jq -r '.video_id // empty')
            URL=$(echo "$INIT" | jq -r '.upload_url // empty')
            if [ -n "$VID" ] && [ -n "$URL" ]; then
              curl -s -X POST "$URL" -H "Authorization: OAuth $PAGE_TOKEN" -H "offset: 0" -H "file_size: $SIZE" \
                --data-binary "@final.mp4" > /dev/null
              FIN=$(curl -s -X POST "$API/$PAGE_ID/video_reels" -H "Content-Type: application/json" \
                -d "$(jq -n --arg t "$PAGE_TOKEN" --arg v "$VID" --rawfile d caption.txt \
                '{upload_phase:"finish",video_id:$v,video_state:"PUBLISHED",description:$d,access_token:$t}')")
              if echo "$FIN" | jq -e '.success == true' > /dev/null 2>&1; then
                POST_ID=$(echo "$FIN" | jq -r '.post_id // empty')
                echo "Reel published"
                break
              fi
              echo "Finish failed: $FIN"
            else
              echo "Init failed: $INIT"
            fi
            VID=""
            sleep 10
          done

          if [ -z "$VID" ]; then
            echo "Falling back to regular video upload"
            RESP=$(curl -s -X POST "$API/$PAGE_ID/videos" -F "source=@final.mp4" \
              -F "description=<caption.txt" -F "access_token=$PAGE_TOKEN")
            VID=$(echo "$RESP" | jq -r '.id // empty')
            [ -z "$VID" ] && { echo "Upload failed: $RESP"; exit 1; }
          fi

          for i in $(seq 1 8); do
            for ID in $POST_ID $VID; do
              R=$(curl -s -X POST "$API/$ID/comments" \
                --data-urlencode "access_token=$PAGE_TOKEN" --data-urlencode "message@comment.txt")
              if echo "$R" | jq -e '.id' > /dev/null 2>&1; then echo "Comment posted on $ID"; exit 0; fi
            done
            echo "Comment retry $i: $R"
            sleep 30
          done
          echo "Could not post comment"; exit 1

      - name: save-used
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add used.json
          git diff --cached --quiet || (git commit -m "update used items [skip ci]" && git pull --rebase && git push)