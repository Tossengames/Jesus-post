          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          W, H, FPS, SR = 1080, 1920, 24, 44100
          VOICE = os.environ.get("VOICE", "en-US-AndrewNeural")


          def find(cands):
              for c in cands:
                  m = sorted(glob.glob(c))
                  if m:
                      return m[0]
              return None


          F_SANS = find(["/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
                         "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
                         "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"])
          F_SERIF = find(["/usr/share/fonts/truetype/noto/NotoSerif-Bold.ttf",
                          "/usr/share/fonts/truetype/noto/NotoSerif-*.ttf"]) or F_SANS

          _fc = {}


          def font(p, s):
              k = (p, s)
              if k not in _fc:
                  _fc[k] = ImageFont.truetype(p, s)
              return _fc[k]


          M = ImageDraw.Draw(Image.new("RGBA", (1, 1)))


          def hexrgb(h):
              h = h.lstrip("#")
              return tuple(int(h[i:i + 2], 16) for i in (0, 2, 4))


          def sanitize(t):
              t = re.sub(r"[^A-Za-z0-9\s\.\,\!\?\;\'\-]", " ", t)
              return re.sub(r"\s+", " ", t).strip()


          def refs(ref):
              return ref.replace(":", " verse ")


