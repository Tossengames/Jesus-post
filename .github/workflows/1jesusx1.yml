name: faith-post

"on":
  workflow_dispatch:
    inputs:
      game:
        description: "Post type"
        required: false
        default: "auto"
        type: choice
        options: [auto, understands, hold_on, season_poll, verse_blank]
  schedule:
  #  - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: faith-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq python3-pip fonts-noto-core
          pip install --quiet --break-system-packages pillow numpy edge-tts

      - name: build-video
        id: build
        timeout-minutes: 12
        env:
          GAME: ${{ github.event.inputs.game }}
          VOICE: en-US-AndrewNeural
        run: |
          cat > game.py << 'PYEOF'
