          TOTAL=$(wc -l < bible_verses.txt)
          IDX=$((RANDOM % TOTAL + 1))
          LINE=$(sed -n "${IDX}p" bible_verses.txt)
          TEXT=$(echo "$LINE" | cut -d'|' -f1)
          REF=$(echo "$LINE" | cut -d'|' -f2)
          
          echo "bible_text=$TEXT" >> "$GITHUB_OUTPUT"
          echo "bible_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Selected: $TEXT ($REF)"

      - name: create-word-timing-script
        id: timing
        timeout-minutes: 1
        run: |
          VIDEO_DUR="${{ steps.vid.outputs.clip }}"
          BIBLE_TEXT="${{ steps.bible.outputs.bible_text }}"
          BIBLE_REF="${{ steps.bible.outputs.bible_ref }}"
          
          cat > generate_subtitle.py << 'PYEOF'
import json
import sys
import math

text = sys.argv[1]
video_dur = float(sys.argv[2])
text_start = float(sys.argv[3])
bible_ref = sys.argv[4]

words = text.split()
if not words:
    sys.exit(1)

# Calculate timing - text builds over 10 seconds
word_anim_dur = min(10.0, video_dur - 3.0)
time_per_word = word_anim_dur / len(words)

# Create simple SRT file for word-by-word display
srt_lines = []
current_idx = 1
current_display = ""

for i, word in enumerate(words):
    start_time = text_start + (i * time_per_word)
    end_time = video_dur - 0.5
    
    if current_display:
        current_display += " " + word
    else:
        current_display = word
    
    # Format timestamps
    start_h = int(start_time // 3600)
    start_m = int((start_time % 3600) // 60)
    start_s = int(start_time % 60)
    start_ms = int((start_time % 1) * 1000)
    
    end_h = int(end_time // 3600)
    end_m = int((end_time % 3600) // 60)
    end_s = int(end_time % 60)
    end_ms = int((end_time % 1) * 1000)
    
    start_str = f"{start_h:01d}:{start_m:02d}:{start_s:02d},{start_ms:03d}"
    end_str = f"{end_h:01d}:{end_m:02d}:{end_s:02d},{end_ms:03d}"
    
    srt_lines.append(str(current_idx))
    srt_lines.append(f"{start_str} --> {end_str}")
    srt_lines.append(current_display)
    srt_lines.append("")
    current_idx += 1

# Add Bible reference at the end
ref_time = video_dur - 2.5
ref_h = int(ref_time // 3600)
ref_m = int((ref_time % 3600) // 60)
ref_s = int(ref_time % 60)
ref_ms = int((ref_time % 1) * 1000)
ref_str = f"{ref_h:01d}:{ref_m:02d}:{ref_s:02d},{ref_ms:03d}"

srt_lines.append(str(current_idx))
srt_lines.append(f"{ref_str} --> {end_str}")
srt_lines.append(f"— {bible_ref} —")

# Write SRT file
with open('subtitle.srt', 'w') as f:
    f.write('\n'.join(srt_lines))

print(f"Generated subtitle with {len(words)} words")
PYEOF
          
          python3 generate_subtitle.py "$BIBLE_TEXT" "$VIDEO_DUR" "1.5" "$BIBLE_REF"

      - name: process-video
        timeout-minutes: 6
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          
          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)
          
          echo "Downloading nature video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -an -c:v copy source_video.mp4
          
          # Get music duration and pick random starting point
          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          if [ -z "$MDUR" ] || [ "$MDUR" -lt 5 ]; then
            MDUR=30
          fi
          MMAX=$((MDUR - 10))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          
          # Extract music clip
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3
          
          # Apply heavy blur and overlay subtitles
          timeout 180 ffmpeg -hide_banner -loglevel error -y \
            -i source_video.mp4 \
            -i music_clip.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=25:10,setsar=1,fade=t=in:st=0:d=1.5,fade=t=out:st=${FADEOUT}:d=1.5,subtitles=subtitle.srt:force_style='FontSize=32,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=1,Alignment=5,MarginV=100'" \
            -af "[1:a]volume=0.8,afade=t=in:st=0:d=1.5,afade=t=out:st=${FADEOUT}:d=1.5[aout]" \
            -map 0:v -map "[aout]" \
            -t "$DUR" \
            -c:v libx264 -preset medium -crf 18 -c:a aac -b:a 192k \
            -movflags +faststart \
            -pix_fmt yuv420p \
            final.mp4
          
          ls -lh final.mp4
          
          HAS_AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 final.mp4 2>/dev/null || echo "")
          if [ -z "$HAS_AUDIO" ]; then
            echo "Warning: Final video has no audio track"
          else
            echo "Video processing complete with heavy blur and word-by-word text"
          fi

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          BIBLE_TEXT: ${{ steps.bible.outputs.bible_text }}
          BIBLE_REF: ${{ steps.bible.outputs.bible_ref }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"
          
          CAPTION="${BIBLE_TEXT} — ${BIBLE_REF}
          
          💭 Let this word sink into your heart today.
          
          👉 Follow for daily encouragement and God's truth.
          🙏 Share this with someone who needs to hear it.
          ❤️ Like if this blessed you.
          
          #GodsWord #BibleVerse #JesusLovesYou #DailyEncouragement #Faith #Hope #Peace #GospelTruth"
          
          ENCODED_CAPTION=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$CAPTION")
          
          for attempt in 1 2 3; do
            echo "Facebook post attempt $attempt..."
            
            RESPONSE=$(timeout 30 curl -sf -X POST "${API}/${PAGE_ID}/videos" \
              -F "access_token=${PAGE_TOKEN}" \
              -F "description=${CAPTION}" \
              -F "source=@${FILE}" \
              -F "published=true" 2>&1) || true
            
            VIDEO_ID=$(echo "$RESPONSE" | jq -r '.id' 2>/dev/null)
            
            if [ -n "$VIDEO_ID" ] && [ "$VIDEO_ID" != "null" ]; then
              echo "✅ Posted to Facebook! Video ID: $VIDEO_ID"
              echo "Verse: ${BIBLE_TEXT} (${BIBLE_REF})"
              exit 0
            fi
            
            echo "Post failed attempt $attempt: $RESPONSE"
            sleep 10
          done
          
          echo "❌ All post attempts failed"
          exit 1