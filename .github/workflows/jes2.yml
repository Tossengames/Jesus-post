name: gospel-encouragement-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 6,18 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=10
          SKIP_HEAD=15
          SKIP_TAIL=10
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="nature| landscape| sky| clouds| forest| mountain| ocean| sunset| lake| river| stars| peaceful| scenic"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 15 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found, creating silent audio"
            mkdir -p bgmusic
            ffmpeg -f lavfi -i anullsrc=r=44100:cl=stereo -t 30 -q:a 9 -acodec libmp3lame bgmusic/silent.mp3 -y
            echo "music_file=bgmusic/silent.mp3" >> "$GITHUB_OUTPUT"
            echo "Using silent audio"
          else
            IDX=$((RANDOM % ${#VALID[@]}))
            PICKED="${VALID[$IDX]}"
            echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
            echo "Selected: $PICKED"
          fi

      - name: pick-bible-content
        id: bible
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Short verses (15 words or less) with title and CTA
          cat > bible_content.txt << 'EOF'
          JESUS SAYS|Come to me, all you who are weary, and I will give you rest.|Matthew 11:28|🙏 Follow for daily encouragement
          JESUS SAYS|I am with you always, to the very end.|Matthew 28:20|❤️ Share this with someone
          JESUS SAYS|Do not let your hearts be troubled. Trust in me.|John 14:1|✨ Save this verse
          GOD'S PROMISE|Peace I leave with you; my peace I give you.|John 14:27|🤍 Follow for more
          JESUS SAYS|I am the way, the truth, and the life.|John 14:6|📖 Share this truth
          JESUS SAYS|Your faith has healed you. Go in peace.|Mark 5:34|🙌 Tag someone who needs this
          JESUS SAYS|Do not be afraid; just believe.|Mark 5:36|💪 Trust Him today
          JESUS SAYS|Everything is possible for one who believes.|Mark 9:23|✨ Keep believing
          JESUS SAYS|Love your neighbor as yourself.|Mark 12:31|💗 Share God's love
          JESUS SAYS|I am the light of the world. Follow me.|John 8:12|🌟 Follow for light
          JESUS SAYS|Take heart! I have overcome the world.|John 16:33|🏆 Victory in Jesus
          JESUS SAYS|Peace be with you! I am sending you.|John 20:21|✝️ Share this peace
          JESUS SAYS|What is impossible with man is possible with God.|Luke 18:27|🙏 Nothing is impossible
          JESUS SAYS|I am the resurrection and the life.|John 11:25|🌅 Hope in Him
          JESUS SAYS|Follow me, and I will make you new.|Matthew 4:19|🕊️ Start fresh today
          JESUS SAYS|Blessed are the peacemakers.|Matthew 5:9|🕊️ Be a peacemaker
          JESUS SAYS|You are the light of the world. Let your light shine.|Matthew 5:14|✨ Shine bright today
          JESUS SAYS|Forgive, and you will be forgiven.|Luke 6:37|💝 Receive forgiveness
          JESUS SAYS|I came to give life, life to the full.|John 10:10|🎉 Live abundantly
          JESUS SAYS|Do not worry about tomorrow.|Matthew 6:34|🌅 Trust God today
          JESUS SAYS|Ask and it will be given to you.|Matthew 7:7|🙏 Ask Him anything
          JESUS SAYS|Let the children come to me.|Matthew 19:14|👶 His love is for all
          JESUS SAYS|Your faith has healed you.|Luke 17:19|🩺 Receive your healing
          JESUS SAYS|I am the good shepherd. I know my sheep.|John 10:14|🐑 He knows you by name
          JESUS SAYS|If you forgive others, God will forgive you.|Matthew 6:14|💖 Walk in forgiveness
          JESUS SAYS|Store up treasures in heaven.|Matthew 6:20|👑 Eternal rewards await
          JESUS SAYS|No one can serve two masters.|Matthew 6:24|🎯 Choose God today
          JESUS SAYS|Come with me and get some rest.|Mark 6:31|😴 Rest in His presence
          JESUS SAYS|Get up, your faith has made you well.|Luke 17:19|💪 Rise up in faith
          JESUS SAYS|I have prayed for you that your faith may not fail.|Luke 22:32|🛡️ He prays for you
          JESUS SAYS|The Spirit is willing.|Mark 14:38|🔥 Let your spirit rise
          JESUS SAYS|Today you will be with me in paradise.|Luke 23:43|✨ Heaven is waiting
          JESUS SAYS|It is finished.|John 19:30|✓ Your debt is paid
          JESUS SAYS|Feed my lambs. Take care of my sheep.|John 21:15|💝 Love His people
          JESUS SAYS|I chose you to bear lasting fruit.|John 15:16|🍇 You will produce fruit
          JESUS SAYS|My grace is enough for you.|2 Corinthians 12:9|✨ His grace covers you
          JESUS SAYS|I can do all things through Christ who strengthens me.|Philippians 4:13|💪 You can do this
          JESUS SAYS|Be strong and courageous. Do not be afraid.|Joshua 1:9|🦁 Be brave today
          JESUS SAYS|Trust in the Lord with all your heart.|Proverbs 3:5|❤️ Trust Him completely
          JESUS SAYS|The Lord is my shepherd; I shall not want.|Psalm 23:1|🐑 He provides for you
          JESUS SAYS|Be still, and know that I am God.|Psalm 46:10|🌿 Rest in His presence
          JESUS SAYS|I will strengthen you and help you.|Isaiah 41:10|💪 He's got your back
          JESUS SAYS|Nothing can separate us from God's love.|Romans 8:39|💗 You are loved forever
          JESUS SAYS|Be kind and compassionate to one another.|Ephesians 4:32|💝 Show kindness today
          JESUS SAYS|Love is patient, love is kind.|1 Corinthians 13:4|💕 Love like Jesus
          JESUS SAYS|God is love. Live in love.|1 John 4:16|💖 Love conquers all
          JESUS SAYS|Cast all your anxiety on Him because He cares.|1 Peter 5:7|🎒 Give Him your worries
          JESUS SAYS|Jesus Christ is the same yesterday, today, and forever.|Hebrews 13:8|🕊️ He never changes
          JESUS SAYS|Let the peace of Christ rule in your hearts.|Colossians 3:15|🕊️ Let peace reign
          JESUS SAYS|God is our refuge and strength.|Psalm 46:1|🛡️ Run to Him today
          EOF
          
          TOTAL=$(wc -l < bible_content.txt)
          IDX=$((RANDOM % TOTAL + 1))
          LINE=$(sed -n "${IDX}p" bible_content.txt)
          
          TITLE=$(echo "$LINE" | cut -d'|' -f1)
          VERSE=$(echo "$LINE" | cut -d'|' -f2)
          REF=$(echo "$LINE" | cut -d'|' -f3)
          CTA=$(echo "$LINE" | cut -d'|' -f4)
          
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "verse=$VERSE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "cta=$CTA" >> "$GITHUB_OUTPUT"
          echo "caption=$VERSE - $REF" >> "$GITHUB_OUTPUT"
          
          echo "Selected: $TITLE - $VERSE"

      - name: process-video
        timeout-minutes: 5
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          TITLE="${{ steps.bible.outputs.title }}"
          VERSE="${{ steps.bible.outputs.verse }}"
          REF="${{ steps.bible.outputs.ref }}"
          CTA="${{ steps.bible.outputs.cta }}"
          
          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)
          
          # Escape special characters for ffmpeg
          VERSE_ESC=$(echo "$VERSE" | sed 's/:/\\:/g; s/'\''/\\'\''/g; s/&/\\&/g')
          REF_ESC=$(echo "$REF" | sed 's/:/\\:/g; s/'\''/\\'\''/g')
          CTA_ESC=$(echo "$CTA" | sed 's/:/\\:/g; s/'\''/\\'\''/g')

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -an -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          if [ -z "$MDUR" ] || [ "$MDUR" -lt 5 ]; then
            MDUR=30
          fi
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))

          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          # Complex drawtext with 3 sections: TITLE (top), VERSE (center with reference), CTA (bottom)
          # Title at top (y=150)
          # Verse centered (y=h/2 - 50)
          # Reference below verse (y=h/2 + 80)
          # CTA at bottom (y=1750)
          
          VFILTER="[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=25:10,setsar=1,fade=t=in:st=0:d=1.5,fade=t=out:st=${FADEOUT}:d=1.5,drawtext=text='${TITLE}':fontfile=/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf:fontcolor=#FFD700:fontsize=65:borderw=2:bordercolor=black:x=(w-text_w)/2:y=150:alpha='if(lt(t,1),0,if(lt(t,2),(t-1)/1,1))',drawtext=text='${VERSE_ESC}':fontfile=/usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf:fontcolor=white:fontsize=55:borderw=3:bordercolor=black@0.9:x=(w-text_w)/2:y=(h/2)-80:alpha='if(lt(t,1.5),0,if(lt(t,2.5),(t-1.5)/1,1))':line_spacing=20,drawtext=text='${REF_ESC}':fontfile=/usr/share/fonts/truetype/liberation/LiberationSerif-Italic.ttf:fontcolor=#FFD700:fontsize=40:borderw=2:bordercolor=black:x=(w-text_w)/2:y=(h/2)+20:alpha='if(lt(t,2),0,if(lt(t,3),(t-2)/1,1))',drawtext=text='${CTA_ESC}':fontfile=/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf:fontcolor=white:fontsize=48:borderw=2:bordercolor=black:x=(w-text_w)/2:y=1750:alpha='if(lt(t,${FADEOUT}),0,min(1,(t-${FADEOUT})/1))'[out]"

          timeout 180 ffmpeg -hide_banner -loglevel error -y -i source.mp4 -i music_clip.mp3 -filter_complex "${VFILTER};[1:a]volume=0.7,afade=t=in:st=0:d=1.5,afade=t=out:st=${FADEOUT}:d=1.5[aout]" -map "[out]" -map "[aout]" -t "$DUR" -c:v libx264 -preset medium -crf 18 -c:a aac -b:a 192k -movflags +faststart -pix_fmt yuv420p final.mp4

          ls -lh final.mp4
          
          HAS_AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 final.mp4 2>/dev/null || echo "")
          if [ -z "$HAS_AUDIO" ]; then
            echo "Warning: Final video has no audio"
          else
            echo "✅ Video created with title, verse, and CTA"
          fi

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.bible.outputs.caption }}
          VERSE: ${{ steps.bible.outputs.verse }}
          REF: ${{ steps.bible.outputs.ref }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"
          
          FULL_CAPTION="${VERSE} — ${REF}
          
          💭 Let this word sink into your heart today.
          
          👉 Follow for daily encouragement and God's truth.
          🙏 Share this with someone who needs to hear it.
          ❤️ Like if this blessed you.
          
          #GodsWord #BibleVerse #JesusLovesYou #DailyEncouragement #Faith #Hope"

          for attempt in 1 2 3; do
            echo "Facebook post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${FULL_CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${FULL_CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "✅ Posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All post attempts failed"
          exit 1