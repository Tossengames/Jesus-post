            {"text": "I have come that they may have life, and have it to the full.", "ref": "John 10:10"},
            {"text": "Your faith has healed you. Go in peace.", "ref": "Mark 5:34"},
            {"text": "Do not be afraid; just believe.", "ref": "Mark 5:36"},
            {"text": "Everything is possible for one who believes.", "ref": "Mark 9:23"},
            {"text": "Love your enemies and pray for those who persecute you.", "ref": "Matthew 5:44"},
            {"text": "The greatest among you will be your servant.", "ref": "Matthew 23:11"},
            {"text": "Be perfect, therefore, as your heavenly Father is perfect.", "ref": "Matthew 5:48"},
            {"text": "Store up for yourselves treasures in heaven.", "ref": "Matthew 6:20"},
            {"text": "No one can serve two masters.", "ref": "Matthew 6:24"},
            {"text": "Do not judge, or you too will be judged.", "ref": "Matthew 7:1"},
            {"text": "Come with me by yourselves to a quiet place and get some rest.", "ref": "Mark 6:31"},
            {"text": "Daughter, your faith has healed you. Go in peace.", "ref": "Luke 8:48"},
            {"text": "Get up, your faith has made you well.", "ref": "Luke 17:19"},
            {"text": "Receive my love today and let it change everything about you.", "ref": "John 15:9"},
            {"text": "You didn't choose me, I chose you. I appointed you to bear lasting fruit.", "ref": "John 15:16"},
