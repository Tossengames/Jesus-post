name: gospel-encouragement-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 6,18 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=10
          SKIP_HEAD=15
          SKIP_TAIL=10
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="nature| landscape| sky| clouds| forest| mountain| ocean| sunset| lake| river| stars| peaceful| scenic"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 15 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found, creating silent audio"
            mkdir -p bgmusic
            ffmpeg -f lavfi -i anullsrc=r=44100:cl=stereo -t 30 -q:a 9 -acodec libmp3lame bgmusic/silent.mp3 -y
            echo "music_file=bgmusic/silent.mp3" >> "$GITHUB_OUTPUT"
            echo "Using silent audio"
          else
            IDX=$((RANDOM % ${#VALID[@]}))
            PICKED="${VALID[$IDX]}"
            echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
            echo "Selected: $PICKED"
          fi

      - name: pick-bible-verse
        id: verse
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          VERSES=(
            "Come to me, all you who are weary and burdened, and I will give you rest.\n\n- Matthew 11:28"
            "I am with you always, to the very end of the age.\n\n- Matthew 28:20"
            "Do not let your hearts be troubled. Trust in God; trust also in me.\n\n- John 14:1"
            "Peace I leave with you; my peace I give you.\n\n- John 14:27"
            "I am the way and the truth and the life.\n\n- John 14:6"
            "Love your neighbor as yourself.\n\n- Mark 12:31"
            "Do not worry about tomorrow, for tomorrow will worry about itself.\n\n- Matthew 6:34"
            "Ask and it will be given to you; seek and you will find.\n\n- Matthew 7:7"
            "I am the light of the world. Whoever follows me will never walk in darkness.\n\n- John 8:12"
            "Your faith has healed you. Go in peace.\n\n- Mark 5:34"
            "Do not be afraid; just believe.\n\n- Mark 5:36"
            "Everything is possible for one who believes.\n\n- Mark 9:23"
            "In this world you will have trouble. But take heart! I have overcome the world.\n\n- John 16:33"
            "Peace be with you!\n\n- John 20:21"
            "Blessed are the peacemakers, for they will be called children of God.\n\n- Matthew 5:9"
            "You are the light of the world. Let your light shine before others.\n\n- Matthew 5:14-16"
            "I have come that they may have life, and have it to the full.\n\n- John 10:10"
            "What is impossible with man is possible with God.\n\n- Luke 18:27"
            "I can do all things through Christ who strengthens me.\n\n- Philippians 4:13"
            "Be strong and courageous. Do not be afraid.\n\n- Joshua 1:9"
            "Trust in the Lord with all your heart.\n\n- Proverbs 3:5-6"
            "The Lord is my shepherd; I shall not want.\n\n- Psalm 23:1"
            "Be still, and know that I am God.\n\n- Psalm 46:10"
            "I will strengthen you and help you.\n\n- Isaiah 41:10"
            "My grace is sufficient for you.\n\n- 2 Corinthians 12:9"
            "Nothing can separate us from the love of God.\n\n- Romans 8:39"
            "Be kind and compassionate to one another.\n\n- Ephesians 4:32"
            "Love is patient, love is kind.\n\n- 1 Corinthians 13:4"
            "God is love.\n\n- 1 John 4:16"
            "Cast all your anxiety on him because he cares for you.\n\n- 1 Peter 5:7"
            "Jesus Christ is the same yesterday and today and forever.\n\n- Hebrews 13:8"
            "Let the peace of Christ rule in your hearts.\n\n- Colossians 3:15"
            "God is our refuge and strength.\n\n- Psalm 46:1"
            "The Lord is close to the brokenhearted.\n\n- Psalm 34:18"
            "Give thanks to the Lord, for he is good.\n\n- Psalm 118:1"
            "I have loved you with an everlasting love.\n\n- Jeremiah 31:3"
            "Do not conform to the pattern of this world.\n\n- Romans 12:2"
            "We know that in all things God works for the good.\n\n- Romans 8:28"
            "Let us not become weary in doing good.\n\n- Galatians 6:9"
            "Do everything in love.\n\n- 1 Corinthians 16:14"
            "Humble yourselves before the Lord, and he will lift you up.\n\n- James 4:10"
            "How great is the love the Father has lavished on us.\n\n- 1 John 3:1"
            "We love because he first loved us.\n\n- 1 John 4:19"
            "Whatever you do, work at it with all your heart, as working for the Lord.\n\n- Colossians 3:23"
            "Create in me a pure heart, O God.\n\n- Psalm 51:10"
            "The heavens declare the glory of God.\n\n- Psalm 19:1"
            "Wait for the Lord; be strong and take heart.\n\n- Psalm 27:14"
            "I praise you because I am fearfully and wonderfully made.\n\n- Psalm 139:14"
          )
          
          IDX=$((RANDOM % ${#VERSES[@]}))
          PICKED="${VERSES[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

      - name: process-video
        timeout-minutes: 5
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          VERSE="${{ steps.verse.outputs.caption }}"
          
          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)
          TEXT_START=1.5
          TEXT_FADE_DUR=0.8

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -an -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          if [ -z "$MDUR" ] || [ "$MDUR" -lt 5 ]; then
            MDUR=30
          fi
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))

          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          VFILTER="[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=25:10,setsar=1,fade=t=in:st=0:d=1,fade=t=out:st=${FADEOUT}:d=1.5,drawtext=text='${VERSE}':fontfile=/usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf:fontcolor=white:fontsize=52:borderw=3:bordercolor=black@0.8:x=(w-text_w)/2:y=(h-text_h)/2:alpha='if(lt(t,${TEXT_START}),0,if(lt(t,${TEXT_START}+${TEXT_FADE_DUR}),(t-${TEXT_START})/${TEXT_FADE_DUR},1))':line_spacing=15[out]"

          timeout 180 ffmpeg -hide_banner -loglevel error -y -i source.mp4 -i music_clip.mp3 -filter_complex "${VFILTER};[1:a]volume=0.8,afade=t=in:st=0:d=1,afade=t=out:st=${FADEOUT}:d=1.5[aout]" -map "[out]" -map "[aout]" -t "$DUR" -c:v libx264 -preset medium -crf 18 -c:a aac -b:a 192k -movflags +faststart -pix_fmt yuv420p final.mp4

          ls -lh final.mp4
          
          HAS_AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 final.mp4 2>/dev/null || echo "")
          if [ -z "$HAS_AUDIO" ]; then
            echo "Warning: Final video has no audio"
          else
            echo "Video created successfully with Bible verse in center"
          fi

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.verse.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "✅ Posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All post attempts failed"
          exit 1