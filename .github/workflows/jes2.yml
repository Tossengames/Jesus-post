name: gospel-moments-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=20
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky| clouds| sunrise| sunset| nature| mountains| forest| ocean| river| stars| light rays| fog| meadow| waterfall| peaceful nature"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 10 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-verse
        id: verse
        timeout-minutes: 1
        run: |
          VERSES=(
            "Be still and know that I am God - Psalm 46 v10"
            "I can do all things through Christ who strengthens me - Philippians 4 v13"
            "The Lord is my shepherd I lack nothing - Psalm 23 v1"
            "Trust in the Lord with all your heart - Proverbs 3 v5"
            "With God all things are possible - Matthew 19 v26"
            "He heals the brokenhearted and binds up their wounds - Psalm 147 v3"
            "The joy of the Lord is your strength - Nehemiah 8 v10"
            "Cast all your anxiety on Him because He cares for you - 1 Peter 5 v7"
            "God causes all things to work together for good - Romans 8 v28"
            "Nothing can separate us from the love of God - Romans 8 v38"
            "He gives strength to the weary - Isaiah 40 v29"
            "Peace I leave with you my peace I give you - John 14 v27"
            "The Lord will fight for you you need only be still - Exodus 14 v14"
            "You are fearfully and wonderfully made - Psalm 139 v14"
            "My grace is sufficient for you - 2 Corinthians 12 v9"
            "Do not worry about tomorrow - Matthew 6 v34"
            "God has not given us a spirit of fear but of power - 2 Timothy 1 v7"
            "I will never leave you nor forsake you - Hebrews 13 v5"
            "Ask and it will be given to you - Matthew 7 v7"
            "I am the way the truth and the life - John 14 v6"
          )
          IDX=$((RANDOM % ${#VERSES[@]}))
          PICKED="${VERSES[$IDX]}"
          echo "verse=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected verse: $PICKED"

      - name: pick-hook
        id: hook
        timeout-minutes: 1
        run: |
          HOOKS=(
            "God has a word for you"
            "Stop and receive this"
            "This is for your soul"
            "Read this. It is for you"
            "He is speaking right now"
            "A message from Heaven"
            "Your Father wants you to know"
            "Let God speak to you"
            "Pause. God is here"
            "This will change your day"
            "He sees you. He loves you"
            "Open your heart right now"
            "Jesus has not forgotten you"
            "Heaven is speaking today"
            "This word is alive for you"
          )
          IDX=$((RANDOM % ${#HOOKS[@]}))
          PICKED="${HOOKS[$IDX]}"
          echo "hook=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected hook: $PICKED"

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAPTIONS=(
            "This one hit different. Save it. #Faith #Gospel #Bible #Jesus #GodIsGood"
            "Read this slowly. #Scripture #Jesus #Hope #Faith #Blessed"
            "Someone needed this today. Share it. #Faith #Word #Blessed #Gospel #God"
            "Let this sink in. #Gospel #Jesus #Grace #Faith #Scripture"
            "This is for you. Don't scroll past. #Bible #Faith #God #Jesus #Hope"
            "Breathe. Read. Believe. #Scripture #Hope #Jesus #Faith #Grace"
            "Tag someone who needs this today. #Gospel #Faith #Blessed #Jesus #Word"
            "Your reminder for today. #Word #Grace #Jesus #Faith #Bible"
            "Drop everything and read this. #Faith #Bible #God #Gospel #Hope"
            "Gods word never fails. #Scripture #Jesus #Hope #Faith #Blessed"
            "This is the truth. Walk in it. #Gospel #Faith #Grace #Jesus #Word"
            "Hold on to this today. #Jesus #Word #Blessed #Faith #God"
            "He is speaking to you right now. #Faith #God #Bible #Hope #Gospel"
            "Dont just scroll. Receive this. #Scripture #Hope #Jesus #Grace #Faith"
            "Screenshot this and keep it close. #Gospel #Grace #Faith #Jesus #Blessed"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          PICKED="${CAPTIONS[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

      - name: pick-cta
        id: cta
        timeout-minutes: 1
        run: |
          CTAS=(
            "Follow for daily Word"
            "Share this with someone"
            "Tag a friend who needs this"
            "Save this verse"
            "Follow for more Gospel"
            "Send this to someone today"
            "Follow for daily Scripture"
            "Share Gods word today"
          )
          IDX=$((RANDOM % ${#CTAS[@]}))
          PICKED="${CTAS[$IDX]}"
          echo "cta=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected CTA: $PICKED"

      - name: process-video
        timeout-minutes: 8
        env:
          VERSE: ${{ steps.verse.outputs.verse }}
          HOOK: ${{ steps.hook.outputs.hook }}
          CTA: ${{ steps.cta.outputs.cta }}
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          # Python builds and EXECUTES the ffmpeg command directly
          # Never passing the filter through a shell variable
          python3 << 'PYEOF'
import os, random, subprocess, sys

verse     = os.environ.get("VERSE", "God is with you - Psalm 46 v5")
hook      = os.environ.get("HOOK",  "God has a word for you")
cta       = os.environ.get("CTA",   "Follow for daily Word")
dur       = 20.0
fadeout   = 18.5
cta_start = 15.0

font_bold   = "/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf"
font_italic = "/usr/share/fonts/truetype/liberation/LiberationSerif-BoldItalic.ttf"
font_reg    = "/usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf"

if not os.path.exists(font_italic):
    font_italic = font_bold

# Random color for this video
palettes = [
    "ffffff",  # white
    "FFD700",  # gold
    "F5C842",  # soft gold
    "AEE4FF",  # sky blue
    "FFB6C1",  # rose gold
    "B5EAD7",  # mint
    "FFBF00",  # amber
    "FFF8DC",  # cream
    "E6CCFF",  # lavender
    "FF8C69",  # coral
]
hex_color  = random.choice(palettes)
text_color = f"#{hex_color}"

def escape_dt(s):
    """Escape string for ffmpeg drawtext value."""
    s = s.replace("\\", "\\\\")
    s = s.replace("'",  "\u2019")    # curly quote - safe in drawtext
    s = s.replace("%",  "\\%")
    s = s.replace(":",  "\\:")
    s = s.replace(",",  "\\,")
    s = s.replace("[",  "\\[")
    s = s.replace("]",  "\\]")
    return s

# ── HOOK (top, stays whole video) ─────────────────────────────────
hook_e     = escape_dt(hook)
hook_alpha = "if(lt(t,0.5),0,min(1,(t-0.5)/0.6))"
dt_hook = (
    f"drawtext=text='{hook_e}'"
    f":fontfile='{font_bold}'"
    f":fontcolor={text_color}"
    f":fontsize=58"
    f":x=(w-text_w)/2"
    f":y=110"
    f":alpha='{hook_alpha}'"
    f":shadowcolor=black@0.85"
    f":shadowx=3:shadowy=3"
)

# ── VERSE word by word ─────────────────────────────────────────────
words      = verse.split()
text_start = 1.5
text_end   = dur * 0.76
interval   = (text_end - text_start) / max(len(words) - 1, 1)

words_per_line = 4
lines      = [words[i:i+words_per_line] for i in range(0, len(words), words_per_line)]
line_h     = 88
block_top  = 960 - (len(lines) * line_h) // 2

dt_filters = [dt_hook]
word_idx   = 0

# Character width estimate at fontsize 70 (serif italic)
char_px  = 34
space_px = 16

for line_num, line_words in enumerate(lines):
    y_pos  = block_top + line_num * line_h
    line_w = sum(len(w) * char_px for w in line_words) + space_px * (len(line_words) - 1)
    x_cursor = (1080 - line_w) // 2

    for word in line_words:
        t_show = text_start + word_idx * interval
        alpha  = f"if(lt(t,{t_show:.2f}),0,min(1,(t-{t_show:.2f})/0.3))"
        ew     = escape_dt(word)

        dt = (
            f"drawtext=text='{ew}'"
            f":fontfile='{font_italic}'"
            f":fontcolor={text_color}"
            f":fontsize=70"
            f":x={x_cursor}"
            f":y={y_pos}"
            f":alpha='{alpha}'"
            f":shadowcolor=black@0.85"
            f":shadowx=3:shadowy=3"
        )
        dt_filters.append(dt)
        x_cursor += len(word) * char_px + space_px
        word_idx += 1

# ── CTA below verse ────────────────────────────────────────────────
cta_y     = block_top + len(lines) * line_h + 80
cta_alpha = f"if(lt(t,{cta_start:.1f}),0,min(1,(t-{cta_start:.1f})/1.2))"
cta_e     = escape_dt(cta)
dt_cta = (
    f"drawtext=text='+ {cta_e} +'"
    f":fontfile='{font_reg}'"
    f":fontcolor={text_color}"
    f":fontsize=52"
    f":x=(w-text_w)/2"
    f":y={cta_y}"
    f":alpha='{cta_alpha}'"
    f":shadowcolor=black@0.9"
    f":shadowx=3:shadowy=3"
)
dt_filters.append(dt_cta)

# ── Build full filter complex string ──────────────────────────────
all_dt  = ",".join(dt_filters)
vf      = (
    f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
    f"crop=1080:1920,setsar=1,"
    f"gblur=sigma=25,"
    f"fade=t=in:st=0:d=1,"
    f"fade=t=out:st={fadeout}:d=1.5,"
    f"{all_dt}[vout];"
    f"[1:a]volume=1.0,afade=t=in:st=0:d=1,afade=t=out:st={fadeout}:d=1.5[aout]"
)

print(f"Built filter: {len(words)} words, {len(lines)} lines, color={hex_color}, interval={interval:.2f}s")

# ── Write ffmpeg command to shell script and run it ────────────────
# This avoids ALL shell variable expansion issues with special chars
cmd_lines = [
    "#!/bin/bash",
    "set -e",
    "timeout 240 ffmpeg -hide_banner -loglevel error -y \\",
    "  -i source.mp4 \\",
    "  -i music_clip.mp3 \\",
    "  -filter_complex '" + vf.replace("'", "'\\''") + "' \\",
    "  -map '[vout]' \\",
    "  -map '[aout]' \\",
    "  -t 20 \\",
    "  -c:v libx264 -preset medium -crf 16 \\",
    "  -c:a aac -b:a 192k \\",
    "  -movflags +faststart \\",
    "  -pix_fmt yuv420p \\",
    "  final.mp4",
]

script = "\n".join(cmd_lines)
with open("/tmp/run_ffmpeg.sh", "w") as f:
    f.write(script)

os.chmod("/tmp/run_ffmpeg.sh", 0o755)
print("Running ffmpeg...")
result = subprocess.run(["/bin/bash", "/tmp/run_ffmpeg.sh"], capture_output=False)
if result.returncode != 0:
    print(f"ffmpeg failed with code {result.returncode}", file=sys.stderr)
    sys.exit(result.returncode)

print("ffmpeg done.")
PYEOF

          ls -lh final.mp4

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All post attempts failed"
          exit 1