name: gospel-encouragement-post

"on":
  workflow_dispatch:
    inputs:
      bible_text:
        description: "Custom Bible verse (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 6,18 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3 fonts-liberation
          # Install additional font for better text rendering
          sudo apt-get install -y fonts-noto-cjk

      - name: find-nature-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=15  # Longer clip for meaningful verses (was 10)
          SKIP_HEAD=15
          SKIP_TAIL=10
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          # Nature-only search terms - no animals
          NATURE_TERMS="nature landscape sky clouds forest mountain ocean sunset lake river field meadow stars aurora horizon peaceful calm scenic beautiful"
          IFS=' ' read -ra TERM_ARR <<< "$NATURE_TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 15 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid nature video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: generate-bible-text
        id: bible
        timeout-minutes: 1
        run: |
          INPUT_TEXT="${{ github.event.inputs.bible_text }}"
          if [ -n "$INPUT_TEXT" ]; then
            echo "bible_text=$INPUT_TEXT" >> "$GITHUB_OUTPUT"
            echo "bible_ref=Custom" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # 200+ Bible verses - Jesus words, encouragement, wisdom, conversational tone
          cat > bible_verses.json << 'EOF'
          [
            {"text": "Come to me, all you who are weary and burdened, and I will give you rest.", "ref": "Matthew 11:28"},
            {"text": "I am with you always, to the very end of the age.", "ref": "Matthew 28:20"},
            {"text": "Do not let your hearts be troubled. Trust in God; trust also in me.", "ref": "John 14:1"},
            {"text": "Peace I leave with you; my peace I give you. Do not let your hearts be troubled.", "ref": "John 14:27"},
            {"text": "I am the way and the truth and the life.", "ref": "John 14:6"},
            {"text": "Let the little children come to me, and do not hinder them.", "ref": "Matthew 19:14"},
            {"text": "Love your neighbor as yourself.", "ref": "Mark 12:31"},
            {"text": "Blessed are the peacemakers, for they will be called children of God.", "ref": "Matthew 5:9"},
            {"text": "Do not worry about tomorrow, for tomorrow will worry about itself.", "ref": "Matthew 6:34"},
            {"text": "Ask and it will be given to you; seek and you will find.", "ref": "Matthew 7:7"},
            {"text": "I am the light of the world. Whoever follows me will never walk in darkness.", "ref": "John 8:12"},
