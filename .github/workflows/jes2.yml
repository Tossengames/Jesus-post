name: gospel-moments-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=20
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky timelapse| clouds timelapse| sunrise landscape| sunset landscape| mountain landscape| ocean waves| river landscape| stars timelapse| light rays forest| fog landscape| waterfall landscape| aerial landscape| peaceful sky"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 5 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1].strip()))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}&category=nature"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-verse
        id: verse
        timeout-minutes: 1
        run: |
          VERSES=(
            "God is within her she will not fall - Psalm 46:5"
            "I can do all things through Christ who strengthens me - Philippians 4:13"
            "For I know the plans I have for you - Jeremiah 29:11"
            "The Lord is my shepherd I lack nothing - Psalm 23:1"
            "You are fearfully and wonderfully made - Psalm 139:14"
          )
          IDX=$((RANDOM % ${#VERSES[@]}))
          PICKED="${VERSES[$IDX]}"
          echo "verse=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected verse: $PICKED"

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAPTIONS=(
            "This one hit different. Save it. #Faith #Gospel #Bible #Jesus #GodIsGood"
            "Read this slowly. #Scripture #Jesus #Hope #Faith #Blessed"
            "Someone needed this today. Share it. #Faith #Word #Blessed #Gospel #God"
            "Let this sink in. #Gospel #Jesus #Grace #Faith #Scripture"
            "This is for you. Don't scroll past. #Bible #Faith #God #Jesus #Hope"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          PICKED="${CAPTIONS[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

      - name: pick-cta
        id: cta
        timeout-minutes: 1
        run: |
          CTAS=(
            "Follow for daily Word"
            "Share this with someone"
            "Tag a friend who needs this"
            "Save this verse"
            "Follow for more Gospel"
          )
          IDX=$((RANDOM % ${#CTAS[@]}))
          PICKED="${CTAS[$IDX]}"
          echo "cta=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected CTA: $PICKED"

      - name: pick-hook
        id: hook
        timeout-minutes: 1
        run: |
          HOOKS=(
            "God has a word for you"
            "Stop and receive this"
            "This is for your soul"
            "Read this. It is for you"
            "He is speaking right now"
          )
          IDX=$((RANDOM % ${#HOOKS[@]}))
          PICKED="${HOOKS[$IDX]}"
          echo "hook=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected hook: $PICKED"

      - name: process-video
        timeout-minutes: 8
        env:
          VERSE: ${{ steps.verse.outputs.verse }}
          HOOK: ${{ steps.hook.outputs.hook }}
          CTA: ${{ steps.cta.outputs.cta }}
          DUR: "20"
          FADEOUT: "18.5"
          CTA_START: "15"
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR_VAL="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          FETCH=$(echo "$DUR_VAL + 5" | bc)

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          python3 << 'PYEOF'
          import os, random, textwrap

          verse     = os.environ.get("VERSE",     "God is with you - Psalm 46:5")
          hook      = os.environ.get("HOOK",      "God has a word for you")
          cta       = os.environ.get("CTA",       "Follow for daily Word")
          dur       = float(os.environ.get("DUR",       "20"))
          fadeout   = float(os.environ.get("FADEOUT",   "18.5"))
          cta_start = float(os.environ.get("CTA_START", "15"))

          font_bold   = "/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf"
          font_italic = "/usr/share/fonts/truetype/liberation/LiberationSerif-BoldItalic.ttf"
          font_reg    = "/usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf"
          font_verse  = font_italic if os.path.exists(font_italic) else font_bold
          font_hook   = font_bold   if os.path.exists(font_bold)   else font_reg
          font_cta    = font_reg    if os.path.exists(font_reg)    else font_bold

          palettes = [
              ("white",     "ffffff"),
              ("gold",      "FFD700"),
              ("soft_gold", "F5C842"),
              ("sky_blue",  "AEE4FF"),
              ("rose_gold", "FFB6C1"),
              ("mint",      "B5EAD7"),
              ("amber",     "FFBF00"),
              ("cream",     "FFF8DC"),
              ("lavender",  "E6CCFF"),
              ("coral",     "FF8C69"),
          ]
          palette_name, hex_color = random.choice(palettes)
          text_color = f"#{hex_color}"

          verse_fontsize = random.randint(58, 72)
          hook_fontsize  = random.randint(48, 60)
          cta_fontsize   = random.randint(42, 52)
          blur_sigma     = 25

          print(f"Style: palette={palette_name} blur={blur_sigma} verse_fs={verse_fontsize}")

          def escape(s):
              return (s.replace("\\", "\\\\")
                       .replace("'",  "\\'")
                       .replace(":",  "\\:")
                       .replace(",",  "\\,")
                       .replace("[",  "\\[")
                       .replace("]",  "\\]"))

          # ── Split verse into clean wrapped lines (max 20 chars per line) ──
          words = verse.split()
          lines = []
          current = []
          for w in words:
              test = " ".join(current + [w])
              if len(test) > 20 and current:
                  lines.append(" ".join(current))
                  current = [w]
              else:
                  current.append(w)
          if current:
              lines.append(" ".join(current))

          total_lines  = len(lines)
          line_h       = verse_fontsize + 28
          block_height = total_lines * line_h
          block_top    = 960 - block_height // 2

          # Each line fades in sequentially
          line_interval = (dur * 0.65 - 1.5) / max(total_lines - 1, 1)

          dt_filters = []

          for i, line in enumerate(lines):
              t_show = 1.5 + i * line_interval
              alpha  = f"if(lt(t,{t_show:.2f}),0,min(1,(t-{t_show:.2f})/0.4))"
              y_pos  = block_top + i * line_h
              el     = escape(line)

              # shadow/glow layer
              dt_filters.append(
                  f"drawtext=text='{el}':fontfile={font_verse}"
                  f":fontcolor=#{hex_color}@0.35:fontsize={verse_fontsize+6}"
                  f":x=(w-text_w)/2:y={y_pos-3}:alpha='{alpha}'"
              )
              # main text
              dt_filters.append(
                  f"drawtext=text='{el}':fontfile={font_verse}"
                  f":fontcolor={text_color}:fontsize={verse_fontsize}"
                  f":x=(w-text_w)/2:y={y_pos}"
                  f":alpha='{alpha}'"
                  f":shadowcolor=black@0.95:shadowx=3:shadowy=3"
              )

          # ── hook (top title) ──────────────────────────────────────────────
          he         = escape(hook)
          hook_alpha = "if(lt(t,0.3),0,min(1,(t-0.3)/0.5))"

          # solid dark bar behind hook for readability
          dt_filters.insert(0,
              "drawbox=x=0:y=80:w=iw:h=160:color=black@0.5:t=fill"
          )
          dt_filters += [
              f"drawtext=text='{he}':fontfile={font_hook}"
              f":fontcolor={text_color}:fontsize={hook_fontsize}"
              f":x=(w-text_w)/2:y=140:alpha='{hook_alpha}'"
              f":shadowcolor=black@1.0:shadowx=3:shadowy=3",
          ]

          # ── CTA (bottom) ──────────────────────────────────────────────────
          ce        = escape(cta)
          cta_alpha = f"if(lt(t,{cta_start:.2f}),0,min(1,(t-{cta_start:.2f})/1.0))"

          dt_filters += [
              "drawbox=x=0:y=1680:w=iw:h=200:color=black@0.55:t=fill",
              f"drawtext=text='{ce}':fontfile={font_cta}"
              f":fontcolor=white:fontsize={cta_fontsize}"
              f":x=(w-text_w)/2:y=1720:alpha='{cta_alpha}'"
              f":shadowcolor=black@1.0:shadowx=3:shadowy=3",
              f"drawtext=text='^ Follow for more ^':fontfile={font_cta}"
              f":fontcolor={text_color}@0.9:fontsize={cta_fontsize-8}"
              f":x=(w-text_w)/2:y=1790:alpha='{cta_alpha}'"
              f":shadowcolor=black@1.0:shadowx=2:shadowy=2",
          ]

          # ── assemble — blur only background, text stays sharp ─────────────
          # Split: one stream gets blurred (background), drawn text goes on top
          all_dt = ",".join(dt_filters)

          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,setsar=1[raw];"
              f"[raw]gblur=sigma={blur_sigma}[bg];"
              f"[bg]fade=t=in:st=0:d=1,"
              f"fade=t=out:st={fadeout:.2f}:d=1.5,"
              f"{all_dt}[vout]"
          )

          with open("/tmp/vfilter.txt", "w") as f:
              f.write(vfilter)

          print(f"Filter built. Lines={total_lines}")
          PYEOF

          VFILTER=$(cat /tmp/vfilter.txt)

          timeout 240 ffmpeg -hide_banner -loglevel error -y \
            -i source.mp4 \
            -i music_clip.mp3 \
            -filter_complex "${VFILTER};[1:a]volume=1.0,afade=t=in:st=0:d=1,afade=t=out:st=18.5:d=1.5[aout]" \
            -map "[vout]" \
            -map "[aout]" \
            -t 20 \
            -c:v libx264 -preset fast -crf 18 \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -pix_fmt yuv420p \
            final.mp4

          ls -lh final.mp4

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All post attempts failed"
          exit 1