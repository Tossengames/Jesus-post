name: gospel-moments-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 14 * * *"  # 10 AM EST / 2 PM UTC daily

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=18
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky| clouds| sunrise| sunset| nature| mountains| forest| ocean| river| stars| light rays| fog| meadow| waterfall| peaceful nature"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 10 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-content
        id: content
        timeout-minutes: 1
        run: |
          # 150 content pieces (30 of each type) — informative, corrects misconceptions, natural tone, no emojis in video text
          CONTENT_RAW=(
            # --- CULTURAL CONTEXT (30) ---
            "Turning the other cheek wasn't about being passive. In Jesus' culture, a backhanded slap was an insult to your honor. By offering the other cheek, you forced your aggressor to treat you as an equal. It was actually a bold move of dignity.|What do you think — is this misunderstood today?|Share your thoughts in the comments."
            "The Good Samaritan wasn't just a nice guy. Samaritans and Jews despised each other. Jesus intentionally chose this example to show that your neighbor isn't just someone like you — it's the person you'd least expect.|Who's someone unexpected who showed you kindness?|Tell your story below."
            "The word 'sin' in Greek is 'hamartia' — it means 'to miss the mark.' It's not about being a bad person. It's about aiming for God's best and falling short. Everyone does it, and that's exactly why grace exists.|Does this change how you think about sin?|Let me know in the comments."
            "The shepherds in Luke 2 were considered low-class and untrustworthy. God announced Jesus' birth to them first — not to religious leaders or Roman officials. That tells you exactly who Jesus came for.|When have you felt like an outsider that God met anyway?|Share your experience."
            "When Jesus said 'the poor will always be with you,' he wasn't dismissing them. In Deuteronomy 15:11, that same line is followed by 'therefore I command you to be open-handed.' It was a call to generosity, not an excuse.|How can you be more generous this week?|Drop your ideas below."
            "The woman at the well came at noon — the hottest time of day. Women usually went in the morning or evening. She came alone because she was shunned. Jesus talked to her anyway, crossing every social boundary.|Who's someone you've been avoiding that God might be nudging you toward?|Think about it."
            "In Jewish culture, a father's blessing was everything. When Jesus said 'I and the Father are one,' he was claiming divine authority — but he was also telling you that you get the same inheritance as a child of God.|Do you live like you're a child of God with full inheritance?|Reflect on that today."
            "The word 'gospel' (euangelion) was used for Roman victory announcements. When Paul used it for Jesus, he was making a bold declaration: Jesus wins. Caesar doesn't. Empire doesn't. Christ does.|What area of your life needs to hear that Jesus has already won?|Think about it."
            "Crucifixion was the worst way to die — reserved for the lowest criminals. Jesus chose that death. He didn't just die for you, he died like a criminal so you would never be seen as one.|What shame are you still carrying that Jesus already took?|Let it go today."
            "A 'redeemer' in the Old Testament was a family member who bought back a relative from slavery. When the Bible calls God your Redeemer, it means he's family who bought you back. You belong to someone who pays the price.|What has God bought you back from?|Share your story."
            "Tax collectors were seen as traitors in Jesus' time. He ate with them anyway and didn't wait for them to clean up first. He met them where they were.|Who have you written off that God still loves?|Something to consider."
            "In ancient times, a widow's position was vulnerable. Jesus cared for them and honored their faith. He sees the vulnerable and the overlooked.|Who's vulnerable that you can care for this week?|Think about it."
            "The Passover meal was a remembrance of Israel's exodus from Egypt. Jesus transformed it into the Last Supper — remembering his own exodus from death. He gave new meaning to an old tradition.|What tradition helps you remember God's faithfulness?|Share it."
            "Roman soldiers were occupiers — the enemy. Jesus healed their servant and showed love to his enemies. He didn't just talk about love — he demonstrated it.|Who's hard for you to love right now?|Pray for them today."
            "Children had no status in ancient society. Jesus welcomed them and said the kingdom belongs to them. He turned the world's hierarchy upside down.|What childlike faith do you need to recover?|Think about it."
            "The Jordan River was where Israel crossed into the promised land. Jesus was baptized there — stepping into his own mission. He chose that place on purpose.|What step of faith are you hesitating to take?|Consider it."
            "In Jewish law, leprosy made you unclean. Jesus touched lepers and healed them anyway. He wasn't afraid of your uncleanness.|What feels unclean in your life that you need Jesus to touch?|Bring it to him."
            "The fig tree was a symbol of Israel. Jesus cursed it to show what happens when there's no fruit. He expects fruit from his people — not perfection, but growth.|What fruit is God looking for in your life right now?|Reflect on that."
            "Carpenters were common tradesmen. Jesus worked as one before his ministry began. He knows what it's like to work with your hands and do ordinary work.|What's your ordinary work that God is preparing you through?|Think about it."
            "The Sea of Galilee was a busy fishing hub. Jesus did many miracles there — calming storms, walking on water, feeding thousands. He chose that location on purpose.|What miracle do you need God to do in your life?|Trust him with it."
            "In ancient times, bread was a staple food. Jesus called himself the bread of life — essential, daily, life-giving. He was saying he's not optional — he's essential.|What are you hungry for that only Jesus can satisfy?|Reflect on that."
            "The mustard seed was the smallest known seed. Jesus used it to show how faith grows — from tiny to massive. Start small. That's how faith works.|What small faith step can you take today?|Consider it."
            "Jerusalem was the center of worship. Jesus wept over it because they rejected him. He doesn't just judge — he grieves. He weeps over those who turn away.|What makes you weep for those who reject God?|Pray for them."
            "In Jewish weddings, the groom prepared a place. Jesus said he's preparing a place for us. He's coming back for his bride. That's the hope we live with.|Do you live with hope that Jesus is coming back?|Let that hope shape your day."
            "The early church met in homes. They broke bread together and shared everything in common. That's community — not just Sunday morning, but everyday life.|What would it look like to live more generously with your church community?|Think about it."
            "The word 'gospel' meant Roman victory news. Paul used it to say: Jesus wins. Caesar doesn't. Empire doesn't. Christ does. That's the good news.|What area of your life needs to hear that Jesus has already won?|Believe it."
            "The concept of 'redeemer' in the Old Testament was a family member who bought back a relative from slavery. God is your redeemer — he bought you back.|What has God bought you back from?|Share it."
            "In Jesus' time, shepherds were considered untrustworthy. God chose them to hear the good news first. He chooses the unlikely.|What's something you felt unqualified for that God used you anyway?|Think about it."
            "The Jewish temple had a curtain separating God from people. When Jesus died, the curtain tore from top to bottom. God made a way for you to come near.|What's keeping you from feeling close to God right now?|Draw near to him."
            "Weddings in ancient Israel lasted a week. Jesus used wedding imagery to describe God's kingdom — a feast, a celebration, a joyful union. It's a picture of his love.|What's your favorite picture of God's love in the Bible?|Share it."

            # --- THEOLOGICAL DISTINCTIONS (30) ---
            "Faith isn't just believing facts about God. Even demons believe and shudder. Faith is trust — it's relying on God like a child trusts a parent. It's relational dependence, not just mental agreement.|Do you believe facts about God or actually trust him?|Think about the difference."
            "Mercy is not getting the punishment you deserve. Grace is getting the good you don't deserve. God gives both — but grace is what transforms you from the inside out.|Which do you need more right now — mercy or grace?|Reflect on that."
            "The fear of God isn't being scared of him. It's reverent awe — like standing at the edge of the Grand Canyon. It's recognizing how big he is and how small you are. That kind of fear actually makes you brave.|When did you last feel awe of God?|Share it."
            "Forgiveness and trust are not the same thing. You forgive because God forgave you, but trust is earned over time. You can forgive someone and still set boundaries. That's wisdom, not weakness.|Who do you need to forgive — even if trust isn't restored?|Choose forgiveness today."
            "Salvation isn't just 'going to heaven when you die.' Eternal life starts now — it's a new quality of life, not just a future address. It's being rescued from sin's power right now.|What would change if you lived like eternal life starts today?|Let that shape your day."
            "Works are things you do for God. Fruit is what God produces through you. One is effort. The other is evidence. Both matter — but fruit comes from abiding, not striving.|What's one way you can abide in Jesus today?|Consider it."
            "Legalism is trying to earn God's approval. Obedience is responding to approval you already have. One is performance. The other is relationship. God wants the second.|Are you obeying to be loved or because you're loved?|Let that question sink in."
            "Justice is about fairness. Righteousness is about being in right relationship with God. One is external. The other is internal. Both matter to God.|Which do you focus on more — justice or righteousness?|Think about it."
            "Repentance isn't just feeling sorry. In Greek, 'metanoia' means a change of mind. It's turning around and going the other way. It's not just regret — it's a new direction.|What do you need to turn away from today?|Take that step."
            "Biblical hope isn't wishful thinking. It's confident expectation based on God's character. It's not 'I hope so' — it's 'I know so.' Because it's based on who God is.|What are you confidently expecting God to do?|Trust him."
            "Love is a choice, not just a feeling. Agape love stays when feelings fade. It's commitment, not romance. That's the love God has for us.|Who's someone you need to choose love for today?|Make that choice."
            "Truth isn't relative. Jesus said he IS the truth — it's a person, not just a concept. Truth has a name.|What truth about God are you wrestling with?|Bring it to him."
            "Holiness isn't perfection. It's being set apart for God's purposes. You don't have to be flawless — just faithful. Set apart means available, not perfect.|What's one thing that's setting you apart from God?|Let it go."
            "Peace isn't the absence of conflict. It's the presence of God in the midst of it. You can have peace in the storm, not just after it.|Where do you need God's peace in the middle of chaos?|Ask him for it."
            "Joy isn't happiness. Happiness depends on circumstances. Joy depends on God. One is fleeting. The other is unshakable.|What's stealing your joy that you need to surrender?|Give it to God."
            "Patience isn't just waiting. It's how you wait — with trust and peace. Anyone can wait. Not everyone can wait well.|What are you waiting for that you need to trust God with?|Trust him with the timing."
            "Humility isn't thinking less of yourself. It's thinking of yourself less. One is self-hatred. The other is freedom.|What would it look like to think of yourself less today?|Consider that."
            "Self-control isn't just willpower. It's the Spirit's power working in you. You can't do it alone — and you're not meant to.|What area of your life needs more Spirit-led self-control?|Ask for his help."
            "Freedom isn't doing whatever you want. It's being free to do what's right. True freedom has boundaries.|What 'freedom' have you been misusing?|Reflect on that."
            "Worship isn't just singing songs on Sunday. It's surrendering your whole life to God every day. Your work, your relationships, your money — all of it.|What would it look like to worship with your whole life?|Let that shape your day."
            "The church isn't a building. It's the body of Christ — you and me. You don't go to church. You are the church.|How can you be the church this week to someone?|Think about it."
            "Baptism isn't just a ritual. It's identifying with Jesus' death and resurrection. It's a public declaration of a private decision.|If you're baptized, how does that shape your daily life?|Let that identity sink in."
            "Communion isn't just a symbol. It's connecting with Christ and his church. Every time you take it, you're saying 'I remember.'|What does communion mean to you?|Reflect on that."
            "Healing isn't always physical. Sometimes it's emotional or spiritual. God heals the whole person, not just the body.|What kind of healing do you need most right now?|Bring it to him."
            "Blessing isn't always material. Sometimes it's knowing God is with you. That's the greatest blessing of all.|What's the greatest blessing God's given you this year?|Share it."
            "Suffering isn't always punishment. Sometimes it's preparation for something greater. What feels like a setback might be a setup.|What's a hard season that ended up preparing you?|Reflect on that."
            "God's love isn't conditional. It's based on his character, not your performance. He doesn't love you more on good days and less on bad days.|Do you live like God's love is conditional or unconditional?|Let that sink in."
            "The cross isn't just an event. It's the demonstration of God's love for all time. He didn't just die for you — he died like a criminal so you wouldn't be seen as one.|What shame are you still carrying that Jesus already took?|Let it go."
            "The resurrection isn't just a miracle. It's the guarantee of your resurrection too. Because he rose, you will rise.|How does the resurrection give you hope today?|Let that hope shape your day."
            "Grace isn't a license to sin. It's the power to overcome it. When you truly understand grace, you don't want to sin — you want to live differently.|What would change if you truly understood grace?|Think about it."

            # --- PRACTICAL FRAMEWORKS (30) ---
            "Prayer isn't about changing God's mind. It's about changing yours. He already knows what you need. Prayer aligns your heart with his will.|What's the point of prayer if God already knows?|Let that question challenge you."
            "The ACTS prayer method: Adoration, Confession, Thanksgiving, Supplication. Start with praise, then confess, give thanks, and finally ask. It keeps prayer balanced.|Which ACTS element do you need to practice more?|Try it today."
            "Sabbath is a gift, not a rule. Rest says you don't have to earn your worth. It's resistance against the lie that you are what you produce.|When did you last truly rest?|Make time for it."
            "Breath prayers: short phrases you repeat throughout the day. 'Lord, have mercy.' 'You are good.' 'Help me see.' It turns the mundane into communion.|What breath prayer can you try today?|Give it a try."
            "When anxious, pray with thanksgiving. Then let God's peace guard your heart. It's a process — not instant, but real.|What are you anxious about that you need to pray through?|Hand it to God."
            "Spend five minutes in scripture before your phone. Small habits create deep change over time. It's not complicated — just consistent.|What's your morning routine with God?|Consider starting one."
            "When you sin, run to God — not from him. Shame makes you hide. Grace invites you back. The fastest way back is confession.|What's keeping you from running to God today?|Run to him."
            "When reading the Bible, ask three questions: What does this say about God? What does this say about me? What should I do about it?|What Bible verse has been speaking to you lately?|Share it."
            "The examen: Reflect on your day. Where did you see God? Where did you resist him? Where do you need forgiveness? It changes everything.|Where did you see God today?|Think about it."
            "When you feel distant from God, do what you did at the start. Read scripture. Pray. Worship. Sometimes obedience leads feelings — not the other way around.|What's your 'first love' that you need to return to?|Return to it."
            "Scripture memorization renews your mind. Hide God's word in your heart. It's armor for the battles you'll face.|What verse are you memorizing right now?|Start today."
            "Journaling helps you see God's faithfulness. Write down what he's done. You'll forget if you don't record it.|What has God done for you this week?|Write it down."
            "Fasting isn't just skipping meals. It's focusing on God without distractions. What you give up, he fills.|What distraction do you need to fast from?|Consider it."
            "Giving isn't just money. It's generosity with your time and attention too. You can be generous even on a budget.|How can you be generous with your time this week?|Think about it."
            "Serve others expecting nothing in return. That's what Jesus did. He didn't serve for applause — he served because it was right.|Who can you serve this week without expecting anything back?|Do it."
            "Confess your sins to someone you trust. Healing comes through honesty. Darkness loses power when it's brought to light.|Who can you be honest with this week?|Find someone."
            "Don't just read the Bible. Meditate on it. Think about what it means. Slow down. Let it sink in.|What passage are you meditating on?|Take it slow."
            "Create a daily rhythm. Pray, read, rest, repeat. Consistency matters more than intensity. Show up every day.|What's your daily spiritual rhythm?|Build one."
            "When you're tired, rest. Even Jesus took time away from crowds. If he needed rest, so do you.|What's stopping you from resting?|Let it go."
            "When you're tempted, remember the way out. God always provides one. Look for it. It's there.|What temptation do you need a way out of?|Look for the way."
            "Use your words to build people up. They're more powerful than you think. You can speak life or death.|Who can you encourage with your words today?|Do it."
            "Forgive quickly. Holding grudges only hurts you, not them. Unforgiveness is poison you drink hoping the other person dies.|Who do you need to forgive quickly?|Choose forgiveness."
            "Speak truth in love. Honesty without kindness is cruelty. Truth without love is just being mean.|What's something you need to say with love?|Say it."
            "Be present with people. Put your phone down and listen. Presence is a gift you can give anyone.|Who needs your full attention today?|Give it to them."
            "Celebrate others. Rejoice with those who rejoice. That's love. Don't be jealous — be happy for them.|Who can you celebrate today?|Tell them."
            "When you fail, get back up. Failure isn't final. It's feedback. Keep going. Quitting isn't an option.|What failure have you let stop you?|Get back up."
            "Don't compare yourself to others. Your path is unique. Comparison is the thief of joy. Stay in your lane.|What comparison is stealing your joy?|Let it go."
            "Trust God with your future. He already knows what's coming. You don't need to see the whole path — just the next step.|What future worry do you need to hand over?|Hand it to him."
            "Be grateful daily. Gratitude changes your perspective. It's hard to be anxious and grateful at the same time.|What's one thing you're grateful for today?|Share it."
            "Practice patience. Growth takes time. Be kind to yourself. You're not done yet — and that's okay.|What area of growth do you need patience with?|Be patient with yourself."

            # --- CORRECTIONS (30) ---
            "'God helps those who help themselves' isn't in the Bible. It's a saying from Ben Franklin. Actually, the gospel says the opposite: God helps the helpless. You don't need to clean up before coming to him.|Have you ever tried to 'fix yourself' before coming to God?|Let that go."
            "'Money is the root of all evil' is a misquote. 1 Timothy 6:10 says the love of money is the root of all kinds of evil. Money isn't the problem — the heart is.|What's your attitude toward money?|Examine your heart."
            "'This too shall pass' isn't scripture. It's a Persian proverb. The Bible says weeping may last for a night, but joy comes in the morning. It's about God's faithfulness, not just time passing.|What season is God getting you through?|Trust his faithfulness."
            "'God never gives you more than you can handle' isn't a promise. 2 Corinthians 1:8 says Paul was burdened beyond his strength. God allows things you can't handle so you learn to depend on him.|What's overwhelmed you lately that you need to surrender?|Hand it to him."
            "'Cleanliness is next to godliness' isn't in the Bible. It's about hygiene. True godliness is about the heart — not perfectionism.|What heart issue is God working on?|Let him work."
            "'When God closes a door he opens a window' isn't scripture. It's just a saying. Sometimes God lets you wait. Sometimes he says no. Trust his character, not just his answers.|What closed door have you been waiting on?|Trust his timing."
            "Your purpose isn't self-fulfillment. It's knowing God and making him known. It's not about you — it's about him.|How are you making God known this week?|Think about it."
            "'Judge not' doesn't mean you can't call out sin. Jesus also said to judge with right judgment. It's about motive — not the act of discernment. We're called to love and speak truth.|What do you need to confront with love?|Speak truth."
            "'God won't put more on you than you can bear' is about temptation, not suffering. 1 Corinthians 10:13 promises a way out of sin, not pain.|What temptation do you need a way out of?|Look for it."
            "'Follow your heart' is dangerous advice. Jeremiah 17:9 says the heart is deceitful. Don't follow your heart — lead it. Follow God instead.|What has your heart been leading you toward that you need to check with God?|Check it."
            "'God has a wonderful plan for your life' is true — but it's not always comfortable. It's about his glory and your good, not your comfort.|What's uncomfortable about where God's leading you?|Trust him anyway."
            "'The Lord helps those who help themselves' was said by Ben Franklin, not God. The gospel says God helps the helpless. You don't need to earn his help.|What do you need to stop trying to fix yourself?|Let him help."
            "'To thine own self be true' isn't scripture. It's Shakespeare. What's more important: being true to yourself or being true to God?|Are you being true to yourself or to God?|Choose him."
            "'Pride comes before a fall' is close. Proverbs says 'Pride goes before destruction.' Pride makes you blind. Humility opens your eyes.|What pride do you need to confess?|Humble yourself."
            "'You reap what you sow' is scripture. But it's about generosity, not punishment. You can't expect a harvest if you don't plant seeds.|What are you sowing right now?|Sow good seeds."
            "'Money answers all things' isn't scripture. It says money can help, but it's not the answer. There are things money can't buy.|What's something money can't buy that you're grateful for?|Reflect on that."
            "'All things work together for good' is scripture. But it's for those who love God. Not everyone — but if you love him, it's for you.|Do you love God? Then trust he's working.|Trust him."
            "'Where two or three are gathered' is about church discipline, not prayer meetings. Context matters. The whole Bible matters.|What does being in community look like for you?|Think about it."
            "'The eye is the lamp of the body' isn't about vision. It's about focus and desire. What you focus on shapes everything.|What are you focusing your eyes on?|Fix them on him."
            "'The body is a temple' is scripture. But it's about being set apart, not just diet. It's not just what you eat — it's how you live.|How can you honor God with your body today?|Honor him."
            "'Submit to authorities' is scripture. But it doesn't mean obey when they're unjust. Wisdom knows the difference.|Where do you need wisdom in submitting to authority?|Ask for wisdom."
            "'Spare the rod spoil the child' isn't scripture. It's a proverb about discipline. Discipline isn't punishment — it's training.|How do you view discipline — punishment or training?|Think about it."
            "'God is love' is scripture. But he's also just, holy, and sovereign. Love isn't his only attribute.|Which aspect of God's character do you need to trust more?|Trust all of him."
            "'Jesus is the reason for the season' is true. But he's the reason for every season — not just Christmas.|What season of life are you in? How is Jesus your reason?|Let that shape your day."
            "'Let go and let God' is wisdom. But it's also action, not passive surrender. You let go AND you move.|What do you need to let go of and also take action on?|Do both."
            "'Forgive and forget' isn't scripture. God remembers our sin no more, but we're human. You can forgive and still remember.|What hurt do you need to forgive, even if you can't forget?|Choose forgiveness."
            "'Good vibes only' isn't scripture. Lament is welcome and part of faith. You don't have to pretend everything's fine.|Are you letting yourself lament honestly before God?|Be honest with him."
            "'Everything happens for a reason' isn't scripture. But God works all things for good. There's a difference.|What's something that didn't make sense that God is redeeming?|Trust his redemption."
            "'You do you' isn't scripture. We're called to die to self and follow Christ. It's not about self-expression — it's about surrender.|What does dying to self look like in your life?|Follow him."
            "'God wants you happy' is a half-truth. He wants you holy. Happiness follows when you pursue him, not when you pursue happiness directly.|What would change if you pursued holiness instead of happiness?|Let that challenge you."

            # --- TIMELINE (30) ---
            "Jesus cleansed the temple twice — not once. First was early in his ministry (John 2). Second was during passion week (Matthew 21). First was a warning. Second was judgment. He gave them a chance.|What needs cleansing in your heart?|Let him clean house."
            "Abraham was 75 when he left Haran and 100 when Isaac was born. He waited 25 years for the promise. God's timing often stretches faith — but he always keeps his word.|What promise are you waiting on?|Trust his timing."
            "Israel was in Egypt for 430 years. God told Abraham it would happen. He let his people suffer for centuries — but he also planned their rescue. He's not late, even when it feels like it.|Have you ever felt like God was late, only to see him on time?|Share your story."
            "The Old Testament was written over about 1,000 years. The New Testament was written over about 50 years. Both point to one person — Jesus. The whole Bible is about him.|What's your favorite book of the Bible and why?|Share it."
            "Jesus was crucified during Passover. The Lamb of God died at the same time lambs were being sacrificed. God planned it that way from the beginning.|Do you understand the significance of Jesus as the Passover Lamb?|Reflect on it."
            "The resurrection happened on the third day — Sunday. The Jewish Sabbath was Saturday. Jesus rose on the first day of the week. That's why Christians worship on Sunday.|How does the resurrection shape your Sunday?|Let it shape your week."
            "Israel was exiled to Babylon for 70 years — exactly what Jeremiah predicted. God didn't abandon them. He disciplined them and brought them back. His promises stand.|What discipline has God used to bring you back?|Reflect on it."
            "The early church was born at Pentecost — 50 days after Passover. Jews from all nations gathered in Jerusalem. The gospel went global from day one.|How has the Holy Spirit empowered you?|Ask for his power."
            "Paul wrote most of the New Testament from prison. His suffering didn't stop his mission. God used his chains to spread the gospel. Your pain has purpose too.|What limitation has God used for his glory?|Trust his purpose."
            "The Bible ends with a wedding — the marriage of Christ and his church. History isn't random. It's all moving toward that day.|Are you living with hope for his return?|Let that hope shape you."
            "Moses spent 40 years in Egypt, 40 in the desert, and 40 leading Israel. God prepares you in the hidden places.|What season of preparation has God had you in?|Trust the process."
            "Israel wandered in the desert for 40 years — one year for each day of spying. Disbelief has consequences.|What is your attitude when things take longer than expected?|Learn patience."
            "Joshua led Israel into the promised land. He was Moses' successor. The mission continues — it's passed on.|What's a promise land that God is calling you to enter?|Step into it."
            "David was king for 40 years. He united Israel and established Jerusalem. He wasn't perfect — but he was faithful.|What legacy are you building?|Build for his kingdom."
            "Solomon built the temple. It took 7 years and was magnificent. But he later turned from God. Success isn't everything.|What are you building for God right now?|Keep building."
            "The temple was destroyed by Babylon in 586 BC. Judah was exiled. But God promised to rebuild — and he did.|What's been destroyed in your life that God wants to rebuild?|Trust his restoration."
            "Cyrus allowed Jews to return to Jerusalem after 70 years. He was God's instrument — a pagan king who served God's purposes.|What unexpected person has God used in your life?|Look for his hand."
            "Nehemiah rebuilt the wall in just 52 days. God blessed the work. When God calls you, he equips you.|What work has God blessed you to accomplish?|Keep going."
            "Israel had no prophet for 400 years. Silence. Then John the Baptist came. Sometimes God is silent before he speaks.|What silence in your life is God about to break?|Wait expectantly."
            "Jesus' ministry lasted 3 years — short but world-changing. You don't need decades to make an impact.|How has Jesus changed everything for you?|Share it."
            "The early church multiplied rapidly. Thousands were added daily. The gospel spread like wildfire.|What's your role in the multiplication of the church?|Be part of it."
            "Stephen was the first martyr. His death sparked persecution — and the church spread. God used his death for life.|What suffering has God used for good in your life?|Trust his redemption."
            "Saul persecuted Christians. He became Paul — the greatest missionary in history. Your past doesn't disqualify you.|What's your before-and-after story with God?|Share it."
            "The gospel spread to Gentiles through Peter and Paul. It was never meant to stay in one culture.|What culture or people group do you need to love more?|Expand your love."
            "John wrote Revelation from Patmos. It's the final book — a vision of hope in the middle of persecution.|What hope do you cling to from Revelation?|Hold on to it."
            "The New Testament was written within 50 years of the resurrection. Eyewitnesses were still alive to verify it.|Why does that matter for your trust in the Bible?|Trust it."
            "The Gospels were written by eyewitnesses or those close to them. They weren't legends — they were testimonies.|Do you believe the Gospels are reliable accounts?|Trust them."
            "The Roman Empire persecuted the church. But it kept growing anyway. Persecution never stops the gospel.|What opposition have you faced that God used?|Trust his purposes."
            "Constantine legalized Christianity in 313 AD. Good and bad came from that. The church gained power — but also lost some of its edge.|What's a positive and a negative of Christianity becoming mainstream?|Think about it."
            "The Bible was translated into Latin by Jerome. It became the common text. The word of God in the language of the people.|What translation do you read and why?|Share it."
          )

          # Split into teach, engage, cta
          IDX=$((RANDOM % ${#CONTENT_RAW[@]}))
          ENTRY="${CONTENT_RAW[$IDX]}"
          TEACH=$(echo "$ENTRY" | cut -d'|' -f1)
          ENGAGE=$(echo "$ENTRY" | cut -d'|' -f2)
          CTA=$(echo "$ENTRY" | cut -d'|' -f3)

          echo "teach=$TEACH" >> "$GITHUB_OUTPUT"
          echo "engage=$ENGAGE" >> "$GITHUB_OUTPUT"
          echo "cta=$CTA" >> "$GITHUB_OUTPUT"
          echo "Selected: ${TEACH:0:50}..."

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAPTIONS=(
            "This hit different for me. Hope it does for you too. Follow for more daily truth. #faith #jesus #bible #god #grace #hope #christian #love #prayer #worship"
            "Read it slow. Let it sink in. Follow if this spoke to you. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "Someone needed this today. You're not alone. Share this with someone who needs it. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Don't scroll past. This is for you. Follow for more encouragement. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "Let this really sink in today. Save this for later. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Been there. This changed me. Follow if this resonated. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "Tag someone who needs to read this today. You never know who needs it. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Read it twice. It's that good. Follow for daily wisdom. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "This is the kind of truth that sets you free. Share it with your people. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Your reminder for today. Right here. Follow for more. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          PICKED="${CAPTIONS[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

      - name: process-video
        timeout-minutes: 8
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          TEACH="${{ steps.content.outputs.teach }}"
          ENGAGE="${{ steps.content.outputs.engage }}"
          CTA="${{ steps.content.outputs.cta }}"

          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          python3 << 'PYEOF'
          import os, math, random

          teach = os.environ.get("TEACH", "God is with you.")
          engage = os.environ.get("ENGAGE", "What do you think?")
          cta = os.environ.get("CTA", "Share your thoughts.")
          dur = float(os.environ.get("DUR", "18"))
          fadeout = float(os.environ.get("FADEOUT", "16.5"))

          font = "/usr/share/fonts/truetype/liberation/LiberationSerif-BoldItalic.ttf"
          font_fallback = "/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf"
          if not os.path.exists(font):
              font = font_fallback

          colors = [
              "white", "gold", "lightyellow", "lightcyan",
              "lightpink", "peachpuff", "lavender", "palegreen",
              "lightskyblue", "wheat"
          ]
          text_color = random.choice(colors)

          titles = [
              "This changed me.",
              "Read this slow.",
              "Don't scroll past.",
              "Someone needed this.",
              "This is for you.",
              "Stop. Read. Breathe.",
              "Let this sink in.",
              "You're not alone.",
              "God sees you.",
              "This is your sign.",
              "Truth for today.",
              "He's still working.",
              "Wait for it.",
              "This one hits.",
              "Keep reading.",
          ]
          title_text = random.choice(titles)
          title_escaped = title_text.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

          title_filter = (
              f"drawtext=text='{title_escaped}'"
              f":fontfile={font}"
              f":fontcolor={text_color}@0.95"
              f":fontsize=48"
              f":x=(w-text_w)/2"
              f":y=120"
              f":alpha='if(lt(t,0.4),0,min(1,(t-0.4)/0.6))'"
              f":shadowcolor=black@0.85"
              f":shadowx=3:shadowy=3"
          )

          # Build teach + engage + cta as one combined text
          full_text = teach + " " + engage + " " + cta
          words = full_text.split()
          chunks = [' '.join(words[i:i+5]) for i in range(0, len(words), 5)]

          total_lines = len(chunks)
          line_height = 85
          center_y = 870
          block_top = center_y - (total_lines * line_height) // 2

          filters = [title_filter]
          text_start = 1.8
          line_interval = 0.9

          # Count how many lines are teach vs engage+cta
          teach_words = teach.split()
          teach_chunk_count = (len(teach_words) + 4) // 5  # ceil division

          for i, chunk in enumerate(chunks):
              y_pos = block_top + i * line_height
              t_show = text_start + i * line_interval
              escaped = chunk.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

              # Highlight engage+cta in lightyellow
              if i >= teach_chunk_count:
                  font_color = "lightyellow"
              else:
                  font_color = text_color

              alpha_expr = f"if(lt(t,{t_show:.2f}),0,min(1,(t-{t_show:.2f})/0.3))"

              ft = (
                  f"drawtext=text='{escaped}'"
                  f":fontfile={font}"
                  f":fontcolor={font_color}"
                  f":fontsize=62"
                  f":x=(w-text_w)/2"
                  f":y={y_pos}"
                  f":alpha='{alpha_expr}'"
                  f":shadowcolor=black@0.8"
                  f":shadowx=3:shadowy=3"
              )
              filters.append(ft)

          all_dt = ",".join(filters)

          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,"
              f"setsar=1,"
              f"gblur=sigma=25,"
              f"fade=t=in:st=0:d=1,"
              f"fade=t=out:st={fadeout:.2f}:d=1.5,"
              f"{all_dt}[vout]"
          )

          with open("/tmp/vfilter.txt", "w") as f:
              f.write(vfilter)

          print(f"Built filter for {len(chunks)} lines | color: {text_color} | title: {title_text}")
          PYEOF

          VFILTER=$(cat /tmp/vfilter.txt)

          timeout 240 ffmpeg -hide_banner -loglevel error -y \
            -i source.mp4 \
            -i music_clip.mp3 \
            -filter_complex "${VFILTER};[1:a]volume=1.0,afade=t=in:st=0:d=1,afade=t=out:st=${FADEOUT}:d=1.5[aout]" \
            -map "[vout]" \
            -map "[aout]" \
            -t "$DUR" \
            -c:v libx264 -preset medium -crf 16 \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -pix_fmt yuv420p \
            final.mp4

          ls -lh final.mp4
        env:
          TEACH: ${{ steps.content.outputs.teach }}
          ENGAGE: ${{ steps.content.outputs.engage }}
          CTA: ${{ steps.content.outputs.cta }}
          DUR: "18"
          FADEOUT: "16.5"

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All post attempts failed"
          exit 1