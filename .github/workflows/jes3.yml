name: gospel-moments-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 14 * * *"  # 10 AM EST / 2 PM UTC daily

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=25
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky| clouds| sunrise| sunset| nature| mountains| forest| ocean| river| stars| light rays| fog| meadow| waterfall| peaceful nature"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 10 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-content
        id: content
        timeout-minutes: 1
        run: |
          # 150 short teaching pieces (30 of each type)
          CONTENTS=(
            # --- CULTURAL CONTEXT (30) ---
            "Turning the other cheek wasn't weakness. It forced your enemy to treat you as an equal."
            "The Good Samaritan was a hated enemy. Jesus said your neighbor is the one you least expect."
            "Sin means 'missing the mark' in Greek. We all aim for God's best and fall short."
            "God announced Jesus' birth to shepherds — outcasts. That's who Jesus came for."
            "When Jesus said 'the poor are always with you' he was calling us to action, not giving an excuse."
            "The woman at the well came alone at noon. Jesus crossed every social boundary to talk to her."
            "A father's blessing meant everything in Jewish culture. Jesus said you get the same inheritance."
            "The word 'gospel' meant Roman victory news. Paul used it to say: Jesus wins."
            "Crucifixion was for the lowest criminals. Jesus died that way so you wouldn't be seen as one."
            "A redeemer was a family member who bought you back from slavery. God is your redeemer."
            "In Jesus' time, shepherds were considered untrustworthy. God chose them to hear the good news first."
            "The Jewish temple had a curtain separating God from people. Jesus tore it when he died."
            "Weddings in ancient Israel lasted a week. Jesus used wedding imagery to describe God's kingdom."
            "Fishing was a common trade in Galilee. Jesus called fishermen to become fishers of men."
            "Tax collectors were seen as traitors. Jesus ate with them anyway and changed their lives."
            "The Samaritan woman was surprised Jesus talked to her. Jews didn't talk to Samaritans publicly."
            "In ancient times, a widow's position was vulnerable. Jesus cared for them and honored their faith."
            "The Passover meal was a remembrance of Israel's exodus. Jesus transformed it into the Last Supper."
            "Roman soldiers were occupiers. Jesus healed their servant and showed love to enemies."
            "Children had no status in ancient society. Jesus welcomed them and said the kingdom belongs to them."
            "The Jordan River was where Israel crossed into the promised land. Jesus was baptized there."
            "In Jewish law, leprosy made you unclean. Jesus touched lepers and healed them anyway."
            "The fig tree was a symbol of Israel. Jesus cursed it to show what happens when there's no fruit."
            "Carpenters were common tradesmen. Jesus worked as one before his ministry began."
            "The Sea of Galilee was a busy fishing hub. Jesus did many miracles there."
            "In ancient times, bread was a staple food. Jesus called himself the bread of life."
            "The mustard seed was the smallest known seed. Jesus used it to show how faith grows."
            "Jerusalem was the center of worship. Jesus wept over it because they rejected him."
            "In Jewish weddings, the groom prepared a place. Jesus said he's preparing a place for us."
            "The early church met in homes. They broke bread together and shared everything in common."

            # --- THEOLOGICAL DISTINCTIONS (30) ---
            "Faith isn't just believing facts. Even demons believe. Faith is trusting God like a child."
            "Mercy is not getting what you deserve. Grace is getting what you don't deserve. Both are gifts."
            "Fear of God isn't terror. It's reverent awe — knowing how big he is and how small you are."
            "Forgiveness is free. Trust is earned. You can forgive someone and still set boundaries."
            "Salvation isn't just going to heaven. Eternal life starts now — it's a new quality of life."
            "Works are what you do for God. Fruit is what God produces through you. Abide and bear fruit."
            "Legalism tries to earn approval. Obedience responds to approval you already have."
            "Justice is about fairness. Righteousness is about right relationship with God. Both matter."
            "Repentance isn't just feeling sorry. It means changing your mind and going the other way."
            "Biblical hope isn't wishful thinking. It's confident expectation based on God's character."
            "Love is a choice, not a feeling. Agape love stays when feelings fade."
            "Truth isn't relative. Jesus said he IS the truth. It's a person, not a concept."
            "Holiness isn't perfection. It's being set apart for God's purposes."
            "Peace isn't the absence of conflict. It's the presence of God in the midst of it."
            "Joy isn't happiness. Happiness depends on circumstances. Joy depends on God."
            "Patience isn't just waiting. It's how you wait — with trust and peace."
            "Humility isn't thinking less of yourself. It's thinking of yourself less."
            "Self-control isn't willpower. It's the Spirit's power working in you."
            "Freedom isn't doing whatever you want. It's being free to do what's right."
            "Worship isn't just singing. It's surrendering your whole life to God."
            "Prayer isn't just talking. It's listening too. Silence is part of prayer."
            "The church isn't a building. It's the body of Christ — you and me."
            "Baptism isn't just a ritual. It's identifying with Jesus' death and resurrection."
            "Communion isn't just a symbol. It's connecting with Christ and his church."
            "Healing isn't always physical. Sometimes it's emotional or spiritual."
            "Blessing isn't always material. Sometimes it's knowing God is with you."
            "Suffering isn't always punishment. Sometimes it's preparation for something greater."
            "God's love isn't conditional. It's based on his character, not your performance."
            "The cross isn't just an event. It's the demonstration of God's love for all time."
            "The resurrection isn't just a miracle. It's the guarantee of your resurrection too."

            # --- PRACTICAL FRAMEWORKS (30) ---
            "Prayer changes you, not God. It aligns your heart with his will."
            "ACTS prayer: Adoration, Confession, Thanksgiving, Supplication. Keep it balanced."
            "Sabbath is a gift, not a rule. Rest says you don't have to earn your worth."
            "Breath prayers: short phrases you repeat throughout the day. Try 'Lord, have mercy.'"
            "When anxious, pray with thanksgiving. Then let God's peace guard your heart."
            "Spend 5 minutes in scripture before your phone. Small habits create deep change."
            "When you sin, run to God — not from him. He's already waiting."
            "When reading the Bible, ask: What does this say about God? About me? What should I do?"
            "The examen: Reflect on your day. Where did you see God? Where did you resist him?"
            "When you feel distant, do what you did at the start. Obedience leads feelings."
            "Scripture memorization renews your mind. Hide God's word in your heart."
            "Journaling helps you see God's faithfulness. Write down what he's done."
            "Fasting isn't just skipping meals. It's focusing on God without distractions."
            "Giving isn't just money. It's generosity with your time and attention too."
            "Serve others expecting nothing in return. That's what Jesus did."
            "Confess your sins to someone you trust. Healing comes through honesty."
            "Don't just read the Bible. Meditate on it. Think about what it means."
            "Create a daily rhythm. Pray, read, rest, repeat. Consistency matters."
            "When you're tired, rest. Even Jesus took time away from crowds."
            "When you're tempted, remember the way out. God always provides one."
            "Use your words to build people up. They're more powerful than you think."
            "Forgive quickly. Holding grudges only hurts you, not them."
            "Speak truth in love. Honesty without kindness is cruelty."
            "Be present with people. Put your phone down and listen."
            "Celebrate others. Rejoice with those who rejoice. That's love."
            "When you fail, get back up. Failure isn't final. Keep going."
            "Don't compare yourself to others. Your path is unique."
            "Trust God with your future. He already knows what's coming."
            "Be grateful daily. Gratitude changes your perspective."
            "Practice patience. Growth takes time. Be kind to yourself."

            # --- CORRECTIONS (30) ---
            "'God helps those who help themselves' isn't in the Bible. God helps the helpless."
            "'Money is the root of all evil' is a misquote. The love of money is the problem."
            "'This too shall pass' isn't scripture. God's faithfulness is what gets you through."
            "'God never gives you more than you can handle' isn't a promise. Paul was burdened beyond his strength."
            "'Cleanliness is next to godliness' isn't in the Bible. Godliness is about the heart."
            "'When God closes a door he opens a window' isn't scripture. Sometimes he says wait."
            "Your purpose isn't self-fulfillment. It's knowing God and making him known."
            "'Judge not' doesn't mean you can't call out sin. Jesus said to judge with right judgment."
            "'God won't put more on you than you can bear' is about temptation, not suffering."
            "'Follow your heart' is dangerous. Jeremiah says the heart is deceitful. Follow God instead."
            "'God has a wonderful plan for your life' isn't a promise. It's true but not always comfortable."
            "'The Lord helps those who help themselves' was said by Ben Franklin, not God."
            "'To thine own self be true' isn't scripture. It's Shakespeare."
            "'Pride comes before a fall' is close. Proverbs says 'Pride goes before destruction.'"
            "'You reap what you sow' is scripture. But it's about generosity, not punishment."
            "'Money answers all things' isn't scripture. It says money can help, but it's not the answer."
            "'All things work together for good' is scripture. But it's for those who love God, not everyone."
            "'Where two or three are gathered' is about church discipline, not prayer meetings."
            "'The eye is the lamp of the body' isn't about vision. It's about focus and desire."
            "'The body is a temple' is scripture. But it's about being set apart, not just diet."
            "'Submit to authorities' is scripture. But it doesn't mean obey when they're unjust."
            "'Spare the rod spoil the child' isn't scripture. It's a proverb about discipline."
            "'You have to love yourself before you love others' isn't scripture. It's psychology."
            "'God is love' is scripture. But he's also just, holy, and sovereign."
            "'Jesus is the reason for the season' is true. But he's the reason for every season."
            "'Let go and let God' is wisdom. But it's also action, not passive surrender."
            "'Forgive and forget' isn't scripture. God remembers our sin no more, but we're human."
            "'Good vibes only' isn't scripture. Lament is welcome and part of faith."
            "'Everything happens for a reason' isn't scripture. But God works all things for good."
            "'You do you' isn't scripture. We're called to die to self and follow Christ."

            # --- TIMELINE (30) ---
            "Jesus cleansed the temple twice — once early, once at the end."
            "Abraham waited 25 years for Isaac. God's timing stretches faith."
            "Israel was in Egypt for 430 years. God planned their rescue all along."
            "The Bible was written over 1,000 years. Every book points to Jesus."
            "Jesus died during Passover. The Lamb of God was sacrificed then."
            "Jesus rose on Sunday. That's why Christians worship on the first day."
            "Israel was exiled for exactly 70 years. God disciplines and restores."
            "Pentecost birthed the church. The gospel went global immediately."
            "Paul wrote most of the New Testament from prison. God used his chains."
            "The Bible ends with a wedding. History moves toward Christ and his church."
            "Moses spent 40 years in Egypt, 40 in the desert, and 40 leading Israel."
            "Israel wandered in the desert for 40 years. One year for each day of spying."
            "Joshua led Israel into the promised land. He was Moses' successor."
            "David was king for 40 years. He united Israel and established Jerusalem."
            "Solomon built the temple. It took 7 years and was magnificent."
            "The temple was destroyed by Babylon in 586 BC. Judah was exiled."
            "Cyrus allowed Jews to return to Jerusalem after 70 years. He was God's instrument."
            "Nehemiah rebuilt the wall in just 52 days. God blessed the work."
            "Israel had no prophet for 400 years. Then John the Baptist came."
            "Jesus' ministry lasted 3 years. It was short but changed everything."
            "The early church multiplied rapidly. Thousands were added daily."
            "Stephen was the first martyr. His death sparked persecution and spread."
            "Saul persecuted Christians. He became Paul and wrote most of the New Testament."
            "The gospel spread to Gentiles through Peter and Paul. It was for all people."
            "John wrote Revelation from Patmos. It's the final book and vision of hope."
            "The New Testament was written within 50 years of Jesus' resurrection."
            "The Gospels were written by eyewitnesses or those close to them."
            "The Roman Empire persecuted the church. But it kept growing anyway."
            "Constantine legalized Christianity in 313 AD. It became the Roman religion."
            "The Bible was translated into Latin by Jerome. It became the common text."
          )
          IDX=$((RANDOM % ${#CONTENTS[@]}))
          PICKED="${CONTENTS[$IDX]}"
          echo "content=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected content: ${PICKED:0:50}..."

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAPTIONS=(
            "This hit different for me. Hope it does for you too. 🙏 Follow for more daily truth. #faith #jesus #bible #god #grace #hope #christian #love #prayer #worship"
            "Read it slow. Let it sink in. 🤍 Follow if this spoke to you. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "Someone needed this today. You're not alone. 🙏 Share this with someone who needs it. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Don't scroll past. This is for you. 🤍 Follow for more encouragement. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "Let this really sink in today. 🙏 Save this for later. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Been there. This changed me. 🤍 Follow if this resonated. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "Tag someone who needs to read this today. 🙏 You never know who needs it. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Read it twice. It's that good. 🤍 Follow for daily wisdom. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "This is the kind of truth that sets you free. 🙏 Share it with your people. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Your reminder for today. Right here. 🤍 Follow for more. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          PICKED="${CAPTIONS[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

      - name: process-video
        timeout-minutes: 8
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          CONTENT="${{ steps.content.outputs.content }}"

          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          python3 << 'PYEOF'
          import os, math, random

          content = os.environ.get("CONTENT", "God is with you.")
          dur = float(os.environ.get("DUR", "25"))
          fadeout = float(os.environ.get("FADEOUT", "23.5"))

          font = "/usr/share/fonts/truetype/liberation/LiberationSerif-BoldItalic.ttf"
          font_fallback = "/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf"
          if not os.path.exists(font):
              font = font_fallback

          colors = [
              "white", "gold", "lightyellow", "lightcyan",
              "lightpink", "peachpuff", "lavender", "palegreen",
              "lightskyblue", "wheat"
          ]
          text_color = random.choice(colors)

          titles = [
              "This changed me.",
              "Read this slow.",
              "Don't scroll past this.",
              "Someone needed this.",
              "This is for you.",
              "Stop. Read. Breathe.",
              "Let this sink in.",
              "You're not alone.",
              "God sees you.",
              "This is your sign.",
              "Truth for today.",
              "He's still working.",
              "Wait for it.",
              "This one hits.",
              "Keep reading.",
          ]
          title_text = random.choice(titles)
          title_escaped = title_text.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

          title_filter = (
              f"drawtext=text='{title_escaped}'"
              f":fontfile={font}"
              f":fontcolor={text_color}@0.95"
              f":fontsize=52"
              f":x=(w-text_w)/2"
              f":y=140"
              f":alpha='if(lt(t,0.4),0,min(1,(t-0.4)/0.6))'"
              f":shadowcolor=black@0.85"
              f":shadowx=3:shadowy=3"
          )

          cta = "Share this with someone who needs it 🙏"
          cta_escaped = cta.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")
          cta_filter = (
              f"drawtext=text='{cta_escaped}'"
              f":fontfile={font}"
              f":fontcolor={text_color}@0.85"
              f":fontsize=46"
              f":x=(w-text_w)/2"
              f":y=210"
              f":alpha='if(lt(t,1.0),0,min(1,(t-1.0)/0.8))'"
              f":shadowcolor=black@0.8"
              f":shadowx=2:shadowy=2"
          )

          # Split content into words, then group into chunks of 5 words
          words = content.split()
          chunks = [' '.join(words[i:i+5]) for i in range(0, len(words), 5)]

          total_lines = len(chunks)
          line_height = 90
          center_y = 900
          block_top = center_y - (total_lines * line_height) // 2

          filters = [title_filter, cta_filter]
          text_start = 1.8
          line_interval = 1.0

          for i, chunk in enumerate(chunks):
              y_pos = block_top + i * line_height
              t_show = text_start + i * line_interval
              escaped = chunk.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

              alpha_expr = f"if(lt(t,{t_show:.2f}),0,min(1,(t-{t_show:.2f})/0.3))"

              ft = (
                  f"drawtext=text='{escaped}'"
                  f":fontfile={font}"
                  f":fontcolor={text_color}"
                  f":fontsize=68"
                  f":x=(w-text_w)/2"
                  f":y={y_pos}"
                  f":alpha='{alpha_expr}'"
                  f":shadowcolor=black@0.8"
                  f":shadowx=3:shadowy=3"
              )
              filters.append(ft)

          all_dt = ",".join(filters)

          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,"
              f"setsar=1,"
              f"gblur=sigma=25,"
              f"fade=t=in:st=0:d=1,"
              f"fade=t=out:st={fadeout:.2f}:d=1.5,"
              f"{all_dt}[vout]"
          )

          with open("/tmp/vfilter.txt", "w") as f:
              f.write(vfilter)

          print(f"Built filter for {len(chunks)} lines | color: {text_color} | title: {title_text}")
          PYEOF

          VFILTER=$(cat /tmp/vfilter.txt)

          timeout 240 ffmpeg -hide_banner -loglevel error -y \
            -i source.mp4 \
            -i music_clip.mp3 \
            -filter_complex "${VFILTER};[1:a]volume=1.0,afade=t=in:st=0:d=1,afade=t=out:st=${FADEOUT}:d=1.5[aout]" \
            -map "[vout]" \
            -map "[aout]" \
            -t "$DUR" \
            -c:v libx264 -preset medium -crf 16 \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -pix_fmt yuv420p \
            final.mp4

          ls -lh final.mp4
        env:
          CONTENT: ${{ steps.content.outputs.content }}
          DUR: "25"
          FADEOUT: "23.5"

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All post attempts failed"
          exit 1