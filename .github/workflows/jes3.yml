name: gospel-moments-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 14 * * *"  # 10 AM EST / 2 PM UTC daily

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=18
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky| clouds| sunrise| sunset| nature| mountains| forest| ocean| river| stars| light rays| fog| meadow| waterfall| peaceful nature"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 10 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-content
        id: content
        timeout-minutes: 1
        run: |
          # 150 tight teaches (1-2 sentences with wit + misconception) + engage + cta
          # Format: "TEACH|ENGAGE|CTA"
          CONTENT_RAW=(
            "Turning the other cheek isn't weakness. It's the most savage move Jesus taught — you force your enemy to treat you as an equal.|Is this misunderstood today? Yes or No?|Drop 💥 if this changed how you see it."
            "Samaritans and Jews hated each other. Jesus chose that example on purpose — your neighbor is the person you'd least expect.|Who's your 'Samaritan' — someone unexpected who helped you?|Tag them if you can."
            "'God helps those who help themselves' isn't in the Bible. Actually, God helps the helpless. You don't need to clean up first.|Have you ever tried to 'fix yourself' before coming to God?|Drop 🙌 if you've been there."
            "Believing in God isn't the same as trusting him. Even demons believe — and shudder. Faith is childlike trust, not just mental agreement.|Can you have one without the other?|Drop 🧒 if you're learning to trust like a child."
            "Prayer isn't changing God's mind. It's changing yours. He already knows what you need. Prayer aligns your heart with his will.|What's the point of prayer if God already knows?|Drop 🙏 if prayer has changed your heart."
            "The cross isn't just an event — it's the demonstration of God's love for all time. He didn't just die for you. He died like a criminal so you wouldn't be seen as one.|What shame are you still carrying that Jesus already took?|Drop 🕊️ if you're releasing shame today."
            "Money isn't the root of all evil. The love of money is. Big difference. Money is neutral — your heart isn't.|What's your attitude toward money? Honest.|Drop 💰 if you're examining your heart today."
            "The Good Samaritan wasn't just a nice guy. He was a hated enemy who showed mercy. Jesus said your neighbor is the one you'd least expect to help.|Who's someone you've written off that God loves anyway?|Drop 🌍 if you believe the gospel is for everyone."
            "You've heard 'follow your heart' your whole life. But Jeremiah says the heart is deceitful. Don't follow your heart — lead it. Follow God instead.|What has your heart been leading you toward that you need to check with God?|Drop ❤️‍🔥 if you need to align your heart with his."
            "Forgiveness is free. Trust is earned. You can forgive someone and still set boundaries. That's wisdom, not weakness.|Who do you need to forgive — even if trust isn't restored yet?|Drop 🕊️ if you're choosing forgiveness today."
            "Faith isn't just believing facts about God. Even demons believe that. Faith is trusting God like a child trusts their parent in the dark.|What's one area where you believe facts but don't trust God?|Drop 🙏 if you want to trust him more."
            "The fear of God isn't being scared of him. It's reverent awe — like standing at the edge of the Grand Canyon. That kind of fear actually makes you brave.|When did you last feel awe of God?|Drop 🌄 if you've stood in awe of him."
            "Salvation isn't just going to heaven when you die. Eternal life starts now — it's a new quality of life, not just a future address.|What would change if you lived like eternal life starts today?|Drop ✨ if you believe eternal life starts now."
            "Works are what you do for God. Fruit is what God produces through you. One is effort. The other is evidence. Both matter — but fruit comes from abiding.|What's one way you can abide in Jesus today?|Drop 🌿 if you want to abide and bear fruit."
            "Legalism tries to earn approval. Obedience responds to approval you already have. One is performance. The other is relationship.|Are you obeying to be loved or because you're loved?|Drop ❤️ if you know you're fully loved."
            "Holiness isn't perfection. It's being set apart for God's purposes. You don't have to be flawless — just faithful.|What's one thing that's setting you apart from God?|Drop 🔥 if you want to be set apart for him."
            "Peace isn't the absence of conflict. It's the presence of God in the midst of it. You can have peace in the storm, not just after it.|Where do you need God's peace in the middle of chaos?|Drop ☮️ if you need his peace today."
            "Joy isn't happiness. Happiness depends on circumstances. Joy depends on God. One is fleeting. The other is unshakable.|What's stealing your joy that you need to surrender?|Drop 😊 if you're choosing joy today."
            "Patience isn't just waiting. It's how you wait — with trust and peace. Anyone can wait. Not everyone can wait well.|What are you waiting for that you need to trust God with?|Drop ⏳ if you're waiting on God."
            "Humility isn't thinking less of yourself. It's thinking of yourself less. Big difference. One is self-hatred. The other is freedom.|What would it look like to think of yourself less today?|Drop 🙇 if you want to walk in humility."
            "Self-control isn't willpower. It's the Spirit's power working in you. You can't do it alone — and you're not meant to.|What area of your life needs more Spirit-led self-control?|Drop 💪 if you need the Spirit's strength today."
            "Freedom isn't doing whatever you want. It's being free to do what's right. True freedom has boundaries.|What 'freedom' have you been misusing?|Drop 🕊️ if you want true freedom."
            "Worship isn't just singing songs on Sunday. It's surrendering your whole life to God every day. Your work, your relationships, your money.|What would it look like to worship with your whole life?|Drop 🙌 if you want to worship him in all you do."
            "The church isn't a building. It's the body of Christ — you and me. You don't go to church. You are the church.|How can you be the church this week to someone?|Drop 🤝 if you want to serve the body of Christ."
            "Baptism isn't just a ritual. It's identifying with Jesus' death and resurrection. It's a public declaration of a private decision.|If you're baptized, how does that shape your daily life?|Drop 🌊 if you're grateful for your baptism."
            "Communion isn't just a symbol. It's connecting with Christ and his church. Every time you take it, you're saying 'I remember.'|What does communion mean to you?|Drop 🍷 if communion is meaningful to you."
            "Healing isn't always physical. Sometimes it's emotional or spiritual. God heals the whole person, not just the body.|What kind of healing do you need most right now?|Drop ❤️‍🩹 if you're asking for healing."
            "Blessing isn't always material. Sometimes it's knowing God is with you. That's the greatest blessing of all.|What's the greatest blessing God's given you this year?|Share your blessing in the comments."
            "Suffering isn't always punishment. Sometimes it's preparation for something greater. What feels like a setback might be a setup.|What's a hard season that ended up preparing you?|Drop 🔥 if you've been refined by suffering."
            "God's love isn't conditional. It's based on his character, not your performance. He doesn't love you more on good days and less on bad days.|Do you live like God's love is conditional or unconditional?|Drop ❤️ if you know his love is unconditional."
            "Sabbath is a gift, not a rule. Rest says you don't have to earn your worth. It's resistance against the lie that you are what you produce.|When did you last truly rest?|Drop 😴 if you need to rest more."
            "Breath prayers: short phrases you repeat all day. 'Lord, have mercy.' 'You are good.' 'Help me see.' It turns the mundane into communion.|What breath prayer can you try today?|Share your breath prayer in the comments."
            "When anxious, pray with thanksgiving. Then let God's peace guard your heart. It's a process — not instant, but real.|What are you anxious about that you need to pray through?|Drop 🤲 if you're handing anxiety to God."
            "Spend 5 minutes in scripture before your phone. Small habits create deep change over time. It's not complicated — just consistent.|What's your morning routine with God?|Drop ☀️ if you're starting your day with him."
            "When you sin, run to God — not from him. Shame makes you hide. Grace invites you back. The fastest way back is confession.|What's keeping you from running to God today?|Drop 🏃 if you're running to him."
            "When reading the Bible, ask three questions: What does this say about God? What does this say about me? What should I do about it?|What Bible verse has been speaking to you lately?|Share your verse and what God's showing you."
            "The examen: Reflect on your day. Where did you see God? Where did you resist him? Where do you need forgiveness? It changes everything.|Where did you see God today?|Drop 🌟 with where you saw him."
            "When you feel distant from God, do what you did at the start. Read scripture. Pray. Worship. Sometimes obedience leads feelings.|What's your 'first love' that you need to return to?|Drop 🔥 if you're returning to your first love."
            "Scripture memorization renews your mind. Hide God's word in your heart. It's armor for the battles you'll face.|What verse are you memorizing right now?|Share the verse you're working on."
            "Journaling helps you see God's faithfulness. Write down what he's done. You'll forget if you don't record it.|What has God done for you this week?|Drop 📝 if you're journaling his faithfulness."
            "Fasting isn't just skipping meals. It's focusing on God without distractions. What you give up, he fills.|What distraction do you need to fast from?|Drop 🍽️ if you're fasting from something."
            "Giving isn't just money. It's generosity with your time and attention too. You can be generous even on a budget.|How can you be generous with your time this week?|Drop ⏰ if you want to give your time."
            "Serve others expecting nothing in return. That's what Jesus did. He didn't serve for applause — he served because it was right.|Who can you serve this week without expecting anything back?|Drop 🛠️ if you're serving someone."
            "Confess your sins to someone you trust. Healing comes through honesty. Darkness loses power when it's brought to light.|Who can you be honest with this week?|Drop 🗣️ if you're practicing confession."
            "Don't just read the Bible. Meditate on it. Think about what it means. Slow down. Let it sink in.|What passage are you meditating on?|Share the passage you're thinking about."
            "Create a daily rhythm. Pray, read, rest, repeat. Consistency matters more than intensity. Show up every day.|What's your daily spiritual rhythm?|Drop 🌀 if you're building a rhythm."
            "When you're tired, rest. Even Jesus took time away from crowds. If he needed rest, so do you.|What's stopping you from resting?|Drop 🛌 if you need rest."
            "When you're tempted, remember the way out. God always provides one. Look for it. It's there.|What temptation do you need a way out of?|Drop 🚪 if you're looking for the way out."
            "Use your words to build people up. They're more powerful than you think. You can speak life or death.|Who can you encourage with your words today?|Drop 💬 if you're building someone up."
            "Forgive quickly. Holding grudges only hurts you, not them. Unforgiveness is poison you drink hoping the other person dies.|Who do you need to forgive quickly?|Drop 🕊️ if you're choosing forgiveness."
            "Speak truth in love. Honesty without kindness is cruelty. Truth without love is just being mean.|What's something you need to say with love?|Drop 💗 if you're speaking truth in love."
            "Be present with people. Put your phone down and listen. Presence is a gift you can give anyone.|Who needs your full attention today?|Drop 📱 if you're putting your phone down."
            "Celebrate others. Rejoice with those who rejoice. That's love. Don't be jealous — be happy for them.|Who can you celebrate today?|Tag someone you're proud of."
            "When you fail, get back up. Failure isn't final. It's feedback. Keep going. Quitting isn't an option.|What failure have you let stop you?|Drop 🔥 if you're getting back up."
            "Don't compare yourself to others. Your path is unique. Comparison is the thief of joy. Stay in your lane.|What comparison is stealing your joy?|Drop 🛑 if you're stopping comparison."
            "Trust God with your future. He already knows what's coming. You don't need to see the whole path — just the next step.|What future worry do you need to hand over?|Drop 🤲 if you're trusting God with your future."
            "Be grateful daily. Gratitude changes your perspective. It's hard to be anxious and grateful at the same time.|What's one thing you're grateful for today?|Share your gratitude in the comments."
            "Practice patience. Growth takes time. Be kind to yourself. You're not done yet — and that's okay.|What area of growth do you need patience with?|Drop 🌱 if you're growing."
            "The shepherds in Luke 2 were low-class outcasts. God announced Jesus' birth to them first. That tells you everything about who Jesus came for.|When did you feel like an outcast that God met you anyway?|Drop 🙌 if you know you belong."
            "Tax collectors were seen as traitors. Jesus ate with them anyway. He didn't wait for them to clean up first. He met them where they were.|What's a group of people you've written off that God loves anyway?|Drop 🌍 if you believe the gospel is for everyone."
            "The woman at the well came alone at noon — the hottest part of the day. She was avoiding everyone. Jesus met her anyway.|Who has God placed in your life that you've been avoiding?|Drop 💬 if God is nudging you toward someone."
            "A father's blessing meant everything in Jewish culture. Jesus said you get the same inheritance — you're not a hired hand, you're a child.|Do you truly believe you're a child of God with full inheritance?|Drop 👑 if you're walking in your identity as God's child."
            "The word 'gospel' meant Roman victory news. Paul used it to say: Jesus wins. Caesar doesn't. Empire doesn't. Christ does.|What area of your life needs to hear that Jesus has already won?|Type 'VICTORY' if you believe he's already overcome."
            "A redeemer was a family member who bought you back from slavery. When the Bible calls God your Redeemer, it means he's your family who bought you back.|What has God bought you back from? Share it.|Comment 'redeemed' if you know you've been bought back."
            "When Jesus said 'the poor are always with you' he wasn't being dismissive. In Deuteronomy, the same phrase is followed by 'therefore I command you to be open-handed.' It was a call to action.|How can you be open-handed with someone this week?|Drop 🤲 if you want to give more generously."
            "The Jewish temple had a curtain separating God from people. When Jesus died, the curtain tore in two — from top to bottom. God made a way.|What's keeping you from feeling close to God right now?|Type 'CLOSE' if you want to draw near to him today."
            "Weddings in ancient Israel lasted a week. Jesus used wedding imagery to describe God's kingdom — a feast, a celebration, a joyful union.|What's your favorite picture of God's love in the Bible?|Share your favorite verse about God's love."
            "Fishing was a common trade in Galilee. Jesus called fishermen to become fishers of men. He used what they already knew to call them.|Who's someone you can share your faith with this week?|Drop 🎣 if you want to share your faith boldly."
            "In ancient times, a widow's position was vulnerable. Jesus cared for them and honored their faith. He sees the vulnerable.|Who's vulnerable that you can care for this week?|Tag someone you know who cares for the vulnerable."
            "The Passover meal was a remembrance of Israel's exodus from Egypt. Jesus transformed it into the Last Supper — remembering his own exodus from death.|What's a tradition that helped you remember God's faithfulness?|Drop 🍞 if communion is meaningful to you."
            "Roman soldiers were occupiers — the enemy. Jesus healed their servant and showed love to enemies. He didn't just talk about love — he demonstrated it.|Who's hard for you to love right now?|Pray for them and comment 'done' when you have."
            "Children had no status in ancient society. Jesus welcomed them and said the kingdom belongs to them. He turned the world's hierarchy upside down.|What childlike faith do you need to recover?|Drop 🌟 if you want to have childlike faith again."
            "The Jordan River was where Israel crossed into the promised land. Jesus was baptized there — stepping into his own mission.|What step of faith are you hesitating to take?|Type 'STEP' if you're ready to move forward."
            "In Jewish law, leprosy made you unclean. Jesus touched lepers and healed them anyway. He wasn't afraid of your uncleanness.|What feels 'unclean' in your life that you need Jesus to touch?|Drop 🩺 if you're asking Jesus to heal you."
            "The fig tree was a symbol of Israel. Jesus cursed it to show what happens when there's no fruit. He expects fruit from his people.|What fruit is God looking for in your life right now?|Drop 🍇 if you want to bear more fruit."
            "Carpenters were common tradesmen. Jesus worked as one before his ministry began. He knows what it's like to work with your hands.|What's your 'ordinary' work that God is preparing you through?|Drop 🔨 if you believe your work matters to God."
            "The Sea of Galilee was a busy fishing hub. Jesus did many miracles there — calming storms, walking on water, feeding thousands.|What miracle do you need God to do in your life right now?|Comment 'MIRACLE' if you're believing for one."
            "In ancient times, bread was a staple food. Jesus called himself the bread of life — essential, daily, life-giving.|What are you hungry for that only Jesus can satisfy?|Drop 🍞 if you're hungry for him."
            "The mustard seed was the smallest known seed. Jesus used it to show how faith grows — from tiny to massive. Start small.|What small faith step can you take today?|Drop 🌱 if you're ready to take a step of faith."
            "Jerusalem was the center of worship. Jesus wept over it because they rejected him. He doesn't just judge — he grieves.|What makes you weep for those who reject God?|Drop 💔 if you have a heart for the lost."
            "In Jewish weddings, the groom prepared a place. Jesus said he's preparing a place for us. He's coming back for his bride.|Do you live with hope that Jesus is coming back?|Drop 🏠 if you're excited for your eternal home."
            "The early church met in homes. They broke bread together and shared everything in common. That's community — not just Sunday morning.|What would it look like for you to live more generously with your church community?|Drop 🤝 if you want to live more generously."
            "Repentance isn't just feeling sorry. In Greek, 'metanoia' means a change of mind. It's turning around and going the other way.|What do you need to turn away from today?|Drop 🔄 if you're turning back to God."
            "Biblical hope isn't wishful thinking. It's confident expectation based on God's character. It's not 'I hope so' — it's 'I know so.'|What are you confidently expecting God to do?|Drop 🌅 if you're full of hope today."
            "Love is a choice, not a feeling. Agape love stays when feelings fade. It's not romance — it's commitment.|Who's someone you need to choose love for today?|Tag someone you're choosing to love today."
            "Truth isn't relative. Jesus said he IS the truth. It's a person, not a concept. Truth has a name.|What truth about God are you wrestling with?|Drop 📖 if you want to know truth more deeply."
            "Pride comes before a fall — Proverbs says it's destruction. Pride makes you blind. Humility opens your eyes.|What pride do you need to confess?|Drop 🙇 if you're humbling yourself."
            "You reap what you sow is scripture. It's about generosity, not punishment. You can't expect a harvest if you don't plant seeds.|What are you sowing right now?|Drop 🌱 if you're sowing good seeds."
            "Money answers all things isn't scripture. It says money can help, but it's not the answer. There are things money can't buy.|What's something money can't buy that you're grateful for?|Drop 💗 if you know money isn't everything."
            "All things work together for good is scripture. But it's for those who love God. Not everyone — but if you love him, it's for you.|Do you love God? Then trust he's working.|Drop ❤️ if you trust his work."
            "Where two or three are gathered is about church discipline, not prayer meetings. Context matters. The whole Bible matters.|What does being in community look like for you?|Drop 🤝 if you value community."
            "The eye is the lamp of the body isn't about vision. It's about focus and desire. What you focus on shapes everything.|What are you focusing your eyes on?|Drop 👀 if you're fixing your eyes on him."
            "The body is a temple is scripture. But it's about being set apart, not just diet. It's not just what you eat — it's how you live.|How can you honor God with your body today?|Drop 🏛️ if you're honoring him."
            "Submit to authorities is scripture. But it doesn't mean obey when they're unjust. Wisdom knows the difference.|Where do you need wisdom in submitting to authority?|Drop 👑 if you're trusting God with this."
            "Spare the rod spoil the child isn't scripture. It's a proverb about discipline. Discipline isn't punishment — it's training.|How do you view discipline — punishment or training?|Drop 🛠️ if you see it as training."
            "God is love is scripture. But he's also just, holy, and sovereign. Love isn't his only attribute.|Which aspect of God's character do you need to trust more?|Drop 🙌 if you're trusting all of him."
            "Jesus is the reason for the season is true. But he's the reason for every season — not just Christmas.|What season of life are you in? How is Jesus your reason?|Drop 🌿 if he's with you in every season."
            "Let go and let God is wisdom. But it's also action, not passive surrender. You let go AND you move.|What do you need to let go of and also take action on?|Drop 👐 if you're letting go and moving."
            "Forgive and forget isn't scripture. God remembers our sin no more, but we're human. You can forgive and still remember.|What hurt do you need to forgive, even if you can't forget?|Drop 🕊️ if you're forgiving today."
            "Good vibes only isn't scripture. Lament is welcome and part of faith. You don't have to pretend everything's fine.|Are you letting yourself lament honestly before God?|Drop 😢 if you're honest with him."
            "Everything happens for a reason isn't scripture. But God works all things for good. There's a difference.|What's something that didn't make sense that God is redeeming?|Drop 🔄 if you've seen him redeem something."
            "You do you isn't scripture. We're called to die to self and follow Christ. It's not about self-expression — it's about surrender.|What does dying to self look like in your life?|Drop ✝️ if you're denying yourself for him."
            "Jesus cleansed the temple twice — once early, once at the end. First was a warning. Second was judgment. He gave them a chance.|What needs cleansing in your heart?|Drop 🧹 if you're letting him clean house."
            "Abraham waited 25 years for Isaac. God's timing often stretches faith — but he always keeps his word.|What promise are you waiting on?|Drop ⏳ if you're waiting on his timing."
            "Israel was in Egypt for 430 years. God let them suffer for centuries — but he planned their rescue all along.|Have you ever felt like God was late, only to see him on time?|Drop 🕊️ if he's been on time for you."
            "The Bible was written over 1,000 years. Both Testaments point to one person — Jesus. The whole Bible is about him.|What's your favorite book of the Bible and why?|Share your favorite book of the Bible."
            "Jesus died during Passover. The Lamb of God was sacrificed at the same time lambs were being offered. God planned it from the beginning.|Do you understand the significance of Jesus as the Passover Lamb?|Drop 🐑 if you see him as your lamb."
            "Jesus rose on Sunday — the first day of the week. That's why Christians worship on Sunday. The resurrection changed everything.|How does the resurrection shape your Sunday?|Drop 🌅 if you live in resurrection power."
            "Israel was exiled for exactly 70 years — what Jeremiah predicted. God disciplines but he also restores.|What discipline has God used to bring you back?|Drop 🔥 if you've been refined and restored."
            "Pentecost birthed the church. Jews from all nations gathered in Jerusalem. The gospel went global from day one.|How has the Holy Spirit empowered you?|Drop 🔥 if you need the Spirit's power."
            "Paul wrote most of the New Testament from prison. God used his chains to spread the gospel. Your pain has purpose too.|What limitation has God used for his glory?|Drop ⛓️ if he's used your chains."
            "The Bible ends with a wedding — the marriage of Christ and his church. History isn't random. It's all moving toward that day.|Are you living with hope for his return?|Drop 👰 if you're excited for the wedding feast."
            "Moses spent 40 years in Egypt, 40 in the desert, and 40 leading Israel. God prepares you in the hidden places.|What season of preparation has God had you in?|Drop 🌄 if you're in a preparation season."
            "Israel wandered in the desert for 40 years — one year for each day of spying. Disbelief has consequences.|What is your attitude when things take longer than expected?|Drop ⏳ if you're learning patience."
            "Joshua led Israel into the promised land. He was Moses' successor. The mission continues — it's passed on.|What's a promise land that God is calling you to enter?|Drop 🌿 if you're ready to enter your promise."
            "David was king for 40 years. He united Israel and established Jerusalem. He wasn't perfect — but he was faithful.|What legacy are you building?|Drop 👑 if you're building God's kingdom."
            "Solomon built the temple. It took 7 years and was magnificent. But he later turned from God. Success isn't everything.|What are you building for God right now?|Drop 🛠️ if you're building something for him."
            "The temple was destroyed by Babylon in 586 BC. Judah was exiled. But God promised to rebuild — and he did.|What's been destroyed in your life that God wants to rebuild?|Drop 🏗️ if you're trusting him to rebuild."
            "Cyrus allowed Jews to return to Jerusalem after 70 years. He was God's instrument — a pagan king who served God's purposes.|What unexpected person has God used in your life?|Drop 🙌 if God's used someone unexpected."
            "Nehemiah rebuilt the wall in just 52 days. God blessed the work. When God calls you, he equips you.|What work has God blessed you to accomplish?|Drop 🧱 if you're building God's kingdom."
            "Israel had no prophet for 400 years. Silence. Then John the Baptist came. Sometimes God is silent before he speaks.|What silence in your life is God about to break?|Drop 📣 if you're expecting a breakthrough."
            "Jesus' ministry lasted 3 years — short but world-changing. You don't need decades to make an impact.|How has Jesus changed everything for you?|Drop ✝️ if he's changed your life."
            "The early church multiplied rapidly. Thousands were added daily. The gospel spread like wildfire.|What's your role in the multiplication of the church?|Drop 🌍 if you're part of the mission."
            "Stephen was the first martyr. His death sparked persecution — and the church spread. God used his death for life.|What suffering has God used for good in your life?|Drop 🔥 if you've seen him redeem pain."
            "Saul persecuted Christians. He became Paul — the greatest missionary in history. Your past doesn't disqualify you.|What's your before-and-after story with God?|Drop 💫 if you're not who you used to be."
            "The gospel spread to Gentiles through Peter and Paul. It was never meant to stay in one culture.|What culture or people group do you need to love more?|Drop 🌏 if you love all nations."
            "John wrote Revelation from Patmos. It's the final book — a vision of hope in the middle of persecution.|What hope do you cling to from Revelation?|Drop 🌅 if you're full of hope."
            "The New Testament was written within 50 years of the resurrection. Eyewitnesses were still alive to verify it.|Why does that matter for your trust in the Bible?|Drop 📖 if you trust the New Testament."
            "The Gospels were written by eyewitnesses or those close to them. They weren't legends — they were testimonies.|Do you believe the Gospels are reliable accounts?|Drop 🙏 if you trust the eyewitness testimony."
            "The Roman Empire persecuted the church. But it kept growing anyway. Persecution never stops the gospel.|What opposition have you faced that God used?|Drop 💪 if you've seen opposition turned to growth."
            "Constantine legalized Christianity in 313 AD. It became the Roman religion. Good and bad came from that.|What's a positive and a negative of Christianity becoming mainstream?|Drop 🤔 if you're thinking about it."
            "The Bible was translated into Latin by Jerome. It became the common text. The word of God in the language of the people.|What translation do you read and why?|Share your Bible translation."
            "The Good Samaritan story ends with 'go and do likewise.' Jesus didn't just tell a story — he gave a mission.|What's your 'go and do likewise' moment waiting for?|Drop 🏃 if you're ready to act."
            "The Prodigal Son's father ran to him. The father didn't wait — he ran. That's how God runs to you.|Have you ever felt God running toward you?|Drop 🏃 if you've felt him chase you."
            "The lost sheep was one out of ninety-nine. Jesus left the ninety-nine to find the one. You matter that much.|When did you feel like the one sheep he found?|Drop 🐑 if you know you're the one he found."
            "The workers in the vineyard got the same pay — no matter when they started. Grace isn't fair — it's generous.|Does grace feel unfair to you? Or freeing?|Drop 🙌 if you're grateful for unfair grace."
            "The Pharisee and the tax collector — one prayed to himself, one begged for mercy. Only one went home justified.|Which prayer sounds more like yours? The proud one or the humble one?|Drop 🙇 if you're the tax collector."
            "The wise and foolish builders — both built houses. But only one built on rock. The storm reveals the foundation.|What foundation are you building your life on?|Drop 🪨 if you're building on the rock."
            "The faithful servant and the wicked servant — both were given responsibility. How you handle little things matters.|What 'little thing' has God trusted you with?|Drop 🤲 if you're being faithful with small things."
            "The ten virgins — five were ready, five weren't. The difference was preparation, not intention.|Are you ready for Jesus' return? Like, really ready?|Drop 🕯️ if you're keeping your lamp full."
            "The talents — one buried, two multiplied. The ones who multiplied were rewarded. The one who buried was condemned.|What talent are you burying out of fear?|Drop 💰 if you're ready to invest what God gave you."
            "The sheep and the goats — both called Jesus 'Lord.' But only one group served. Faith without works is dead.|What's one way you've served Jesus by serving others this week?|Drop 🤝 if you're serving."
            "The rich young ruler walked away sad. He had everything — but he couldn't let go of his money. Jesus asked for his heart.|What are you holding onto that Jesus might ask you to release?|Drop 🤲 if you're letting go."
            "The persistent widow kept knocking. The judge gave in — not because he cared, but because she wouldn't stop. Keep praying.|What are you praying persistently for?|Drop 🔔 if you're not giving up."
          )

          # Split into teach, engage, cta
          IDX=$((RANDOM % ${#CONTENT_RAW[@]}))
          ENTRY="${CONTENT_RAW[$IDX]}"
          TEACH=$(echo "$ENTRY" | cut -d'|' -f1)
          ENGAGE=$(echo "$ENTRY" | cut -d'|' -f2)
          CTA=$(echo "$ENTRY" | cut -d'|' -f3)

          echo "teach=$TEACH" >> "$GITHUB_OUTPUT"
          echo "engage=$ENGAGE" >> "$GITHUB_OUTPUT"
          echo "cta=$CTA" >> "$GITHUB_OUTPUT"
          echo "Selected: ${TEACH:0:50}..."

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAPTIONS=(
            "This hit different for me. Hope it does for you too. 🙏 Follow for more daily truth. #faith #jesus #bible #god #grace #hope #christian #love #prayer #worship"
            "Read it slow. Let it sink in. 🤍 Follow if this spoke to you. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "Someone needed this today. You're not alone. 🙏 Share this with someone who needs it. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Don't scroll past. This is for you. 🤍 Follow for more encouragement. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "Let this really sink in today. 🙏 Save this for later. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Been there. This changed me. 🤍 Follow if this resonated. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "Tag someone who needs to read this today. 🙏 You never know who needs it. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Read it twice. It's that good. 🤍 Follow for daily wisdom. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
            "This is the kind of truth that sets you free. 🙏 Share it with your people. #faith #jesus #bible #god #hope #grace #christian #love #prayer #worship"
            "Your reminder for today. Right here. 🤍 Follow for more. #faith #jesus #bible #god #hope #grace #christian #trust #peace #truth"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          PICKED="${CAPTIONS[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

      - name: process-video
        timeout-minutes: 8
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          TEACH="${{ steps.content.outputs.teach }}"
          ENGAGE="${{ steps.content.outputs.engage }}"
          CTA="${{ steps.content.outputs.cta }}"

          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          python3 << 'PYEOF'
          import os, math, random

          teach = os.environ.get("TEACH", "God is with you.")
          engage = os.environ.get("ENGAGE", "What do you think?")
          cta = os.environ.get("CTA", "Drop a comment.")
          dur = float(os.environ.get("DUR", "18"))
          fadeout = float(os.environ.get("FADEOUT", "16.5"))

          font = "/usr/share/fonts/truetype/liberation/LiberationSerif-BoldItalic.ttf"
          font_fallback = "/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf"
          if not os.path.exists(font):
              font = font_fallback

          colors = [
              "white", "gold", "lightyellow", "lightcyan",
              "lightpink", "peachpuff", "lavender", "palegreen",
              "lightskyblue", "wheat"
          ]
          text_color = random.choice(colors)

          titles = [
              "This changed me.",
              "Read this slow.",
              "Don't scroll past.",
              "Someone needed this.",
              "This is for you.",
              "Stop. Read. Breathe.",
              "Let this sink in.",
              "You're not alone.",
              "God sees you.",
              "This is your sign.",
              "Truth for today.",
              "He's still working.",
              "Wait for it.",
              "This one hits.",
              "Keep reading.",
          ]
          title_text = random.choice(titles)
          title_escaped = title_text.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

          title_filter = (
              f"drawtext=text='{title_escaped}'"
              f":fontfile={font}"
              f":fontcolor={text_color}@0.95"
              f":fontsize=48"
              f":x=(w-text_w)/2"
              f":y=120"
              f":alpha='if(lt(t,0.4),0,min(1,(t-0.4)/0.6))'"
              f":shadowcolor=black@0.85"
              f":shadowx=3:shadowy=3"
          )

          # Build teach + engage + cta as one combined text
          full_text = teach + " " + engage + " " + cta
          words = full_text.split()
          chunks = [' '.join(words[i:i+5]) for i in range(0, len(words), 5)]

          total_lines = len(chunks)
          line_height = 85
          center_y = 870
          block_top = center_y - (total_lines * line_height) // 2

          filters = [title_filter]
          text_start = 1.8
          line_interval = 0.9

          # Count how many lines are teach vs engage+cta
          teach_words = teach.split()
          teach_chunk_count = (len(teach_words) + 4) // 5  # ceil division

          for i, chunk in enumerate(chunks):
              y_pos = block_top + i * line_height
              t_show = text_start + i * line_interval
              escaped = chunk.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

              # Highlight engage+cta in lightyellow
              if i >= teach_chunk_count:
                  font_color = "lightyellow"
              else:
                  font_color = text_color

              alpha_expr = f"if(lt(t,{t_show:.2f}),0,min(1,(t-{t_show:.2f})/0.3))"

              ft = (
                  f"drawtext=text='{escaped}'"
                  f":fontfile={font}"
                  f":fontcolor={font_color}"
                  f":fontsize=62"
                  f":x=(w-text_w)/2"
                  f":y={y_pos}"
                  f":alpha='{alpha_expr}'"
                  f":shadowcolor=black@0.8"
                  f":shadowx=3:shadowy=3"
              )
              filters.append(ft)

          all_dt = ",".join(filters)

          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,"
              f"setsar=1,"
              f"gblur=sigma=25,"
              f"fade=t=in:st=0:d=1,"
              f"fade=t=out:st={fadeout:.2f}:d=1.5,"
              f"{all_dt}[vout]"
          )

          with open("/tmp/vfilter.txt", "w") as f:
              f.write(vfilter)

          print(f"Built filter for {len(chunks)} lines | color: {text_color} | title: {title_text}")
          PYEOF

          VFILTER=$(cat /tmp/vfilter.txt)

          timeout 240 ffmpeg -hide_banner -loglevel error -y \
            -i source.mp4 \
            -i music_clip.mp3 \
            -filter_complex "${VFILTER};[1:a]volume=1.0,afade=t=in:st=0:d=1,afade=t=out:st=${FADEOUT}:d=1.5[aout]" \
            -map "[vout]" \
            -map "[aout]" \
            -t "$DUR" \
            -c:v libx264 -preset medium -crf 16 \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -pix_fmt yuv420p \
            final.mp4

          ls -lh final.mp4
        env:
          TEACH: ${{ steps.content.outputs.teach }}
          ENGAGE: ${{ steps.content.outputs.engage }}
          CTA: ${{ steps.content.outputs.cta }}
          DUR: "18"
          FADEOUT: "16.5"

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All post attempts failed"
          exit 1