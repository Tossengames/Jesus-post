name: Daily Kindness Posts

on:
  schedule:
    # 3 times a day in USA Eastern Time (UTC-5/UTC-4)
    #- cron: '0 11 * * *'  # 7:00 AM EDT / 6:00 AM EST (UTC-4/UTC-5)
   # - cron: '0 16 * * *'  # 12:00 PM EDT / 11:00 AM EST (UTC-4/UTC-5)
    #- cron: '0 20 * * *'  # 4:00 PM EDT / 3:00 PM EST (UTC-4/UTC-5)
  workflow_dispatch: # Allows manual triggering

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This allows the workflow to modify files in your repository
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Needed for write permissions
    
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
    
      - name: Create requirements.txt
        run: |
          echo "requests>=2.25.1
          Pillow>=8.1.0
          google-generativeai>=0.3.0" > requirements.txt
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
      - name: Run kindness posting script
        run: python wise.py
    
      - name: Commit and push if posted.json changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted.json
          git diff --staged --quiet || git commit -m "Update posted.json with new kindness post"
          git push