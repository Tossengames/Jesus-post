const THEMES=[
 {id:'dawn',bg:bgDawn,accent:'#ffd98a'},{id:'night',bg:bgNight,accent:'#a9d4ff'},
 {id:'clouds',bg:bgClouds,accent:'#fff0b8'},{id:'glass',bg:bgGlass,accent:'#ffd54f'},
