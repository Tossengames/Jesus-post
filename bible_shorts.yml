/* =====================================================================
   TEXT ROLES + LAYOUT ENGINE
   ===================================================================== */
const ROLE={
 head:    {size:60,min:30,lh:1.08,gap:22},
 answer:  {size:56,min:30,lh:1.1, gap:14},
 question:{size:38,min:24,lh:1.22,gap:20},
 bigquote:{size:44,min:24,lh:1.22,gap:22},
 body:    {size:30,min:19,lh:1.4, gap:20},
 ref:     {size:20,min:14,lh:1.3, gap:0,ls:3},
 tag:     {size:17,min:13,lh:1.3, gap:10,ls:4}
};
const isDisp=r=>r==='head'||r==='answer';
function fontStr(role,size,F){
 if(isDisp(role))return F.dw+' '+size+'px '+F.d;
 if(role==='question'||role==='bigquote')return '700 '+size+'px '+F.d;
 return F.bw+' '+size+'px '+F.b;
}
function wrap(text,font,maxW,lsp){
 ctx.font=font;ls(lsp||0);
 const words=text.split(' '),lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
 if(cur)lines.push(cur);ls(0);return lines;
}
function measureBlock(b,s,F,maxW){
 const R=ROLE[b.role];
 const size=Math.max(R.min,R.size*(isDisp(b.role)?F.ds:1)*s);
 const font=fontStr(b.role,size,F);
 const upper=F.upper&&(isDisp(b.role)||b.role==='tag'||b.role==='ref');
 const text=upper?b.text.toUpperCase():b.text;
 const lines=wrap(text,font,maxW,R.ls||0);
 const lh=size*R.lh;
 let h=lines.length*lh;
 if(b.cd)h=Math.max(h,118);
 return {b,size,font,lines,lh,h,ls:R.ls||0,gap:R.gap*s};
}

/* ===== scene creation ===== */
const pools={};
function nextItem(type){
 if(!pools[type]||!pools[type].length)pools[type]=shuffle(DATA[type]);
 return pools[type].pop();
}
function weighted(){
 const keys=Object.keys(WEIGHTS);let r=Math.random()*keys.reduce((a,k)=>a+WEIGHTS[k],0);
 for(const k of keys){r-=WEIGHTS[k];if(r<=0)return k;}return 'verse';
}
const recent={theme:[],layout:[],anim:[],font:[]};
function pickAvoid(list,key,keep){
 const opts=list.filter(x=>!recent[key].includes(x));
 const v=pick(opts.length?opts:list);
 recent[key].push(v);if(recent[key].length>keep)recent[key].shift();return v;
}
function buildBlocks(type,d){
 const B=[];let label='';
 switch(type){
  case 'verse':case 'promise':
   label=type==='verse'?pick(['VERSE OF THE DAY','SCRIPTURE','DAILY WORD']):'PROMISE OF GOD';
   B.push({role:'head',text:d[0]});
   B.push({role:'body',text:'\u201C'+d[1]+'\u201D',speak:d[1]});
   B.push({role:'ref',text:'\u2014 '+d[2],speak:d[2]});break;
  case 'jesus':
   label='WORDS OF JESUS';
   B.push({role:'bigquote',text:'\u201C'+d[0]+'\u201D',speak:d[0]});
   B.push({role:'ref',text:'\u2014 '+d[1],speak:d[1]});break;
  case 'miracle':case 'parable':
   label=type==='miracle'?'MIRACLE OF JESUS':'PARABLE OF JESUS';
   B.push({role:'head',text:d[0],speak:d[0]});
   B.push({role:'body',text:d[1],speak:d[1]});
   B.push({role:'ref',text:d[2],speak:chapterOnly(d[2])});break;
  case 'names':
   label='NAMES OF JESUS';
   B.push({role:'head',text:d[0],speak:d[0]});
   B.push({role:'body',text:d[1],speak:d[1]});
   B.push({role:'ref',text:'\u2014 '+d[2],speak:d[2]});break;
  case 'quiz':
   label='BIBLE QUIZ';
   B.push({role:'question',text:d[0],speak:d[0]});
   B.push({role:'answer',text:d[1],speak:d[1],gap:3.2,cd:true});
   if(d[2])B.push({role:'ref',text:d[2]});break;
  case 'whosaid':
   label='WHO SAID IT?';
   B.push({role:'question',text:'\u201C'+d[0]+'\u201D',speak:'Who said this? '+d[0]});
   B.push({role:'answer',text:d[1],speak:d[1],gap:3.2,cd:true});
   if(d[2])B.push({role:'ref',text:d[2]});break;
  case 'prophecy':
   label='PROPHECY FULFILLED';
   B.push({role:'tag',text:'FORETOLD \u00B7 '+d[1],when:'withNext'});
   B.push({role:'body',text:'\u201C'+d[0]+'\u201D',speak:'Foretold in '+d[1]+'. '+d[0]});
   B.push({role:'tag',text:'FULFILLED \u00B7 '+d[3],when:'withNext'});
   B.push({role:'body',text:'\u201C'+d[2]+'\u201D',speak:'Fulfilled in '+d[3]+'. '+d[2]});break;
  case 'prayer':
   label='PRAYER';
   B.push({role:'head',text:d[0],speak:d[0]});
   B.push({role:'body',text:d[1],speak:d[1]});break;
 }
 const pool=CTA[type]||CTA.general;
 if(Math.random()<(CTA_CHANCE[type]!=null?CTA_CHANCE[type]:.4)){
  const c=pick(pool);B.push({role:'cta',text:c,speak:c,gap:.2,optional:true});
 }
 return {label,blocks:B};
}
let S=null,CUR=null;
function makeScene(o){
 o=o||{};
 const type=o.type||weighted();
 const d=nextItem(type);
 const built=buildBlocks(type,d);
 const quizLike=type==='quiz'||type==='whosaid'||type==='prophecy';
 const layoutList=quizLike?['center','card']:Object.keys(LAYOUTS);
 const look={
  theme:o.theme!=null?o.theme:THEMES.indexOf(pickAvoid(THEMES,'theme',3)),
  layout:o.layout||pickAvoid(layoutList,'layout',1),
  anim:o.anim||pickAvoid(ANIMS,'anim',2),
  font:o.font!=null?o.font:FONTS.indexOf(pickAvoid(FONTS,'font',2))
 };
 return {type,label:built.label,blocks:built.blocks,look,caption:pick(CAPTIONS[type]),
         phase:Math.random()*40};
}

/* ===== timing ===== */
function computeTimes(blocks,T,keep){
 const appear={},starts={},ends={};
 keep.forEach(i=>{
  if(blocks[i].speak&&T.starts[i]!=null){starts[i]=T.starts[i];ends[i]=T.ends[i];appear[i]=Math.max(.25,T.starts[i]-.15);}
 });
 keep.forEach((i,k)=>{
  if(appear[i]!=null)return;
  const b=blocks[i];let a;
  if(b.when==='withNext'){const nx=keep.slice(k+1).find(j=>appear[j]!=null);a=nx!=null?appear[nx]-.05:.3;}
  else if(k===0)a=.25;
  else{const pv=appear[keep[k-1]];a=(pv!=null?pv:.25)+.4;}
  appear[i]=Math.max(.2,a);
 });
 return {appear,starts,ends};
}

/* ===== build layout + tokens for one playback ===== */
function modeFor(role,anim){
 if(isDisp(role))return anim;
 if(role==='question'||role==='bigquote'||role==='body')return 'sync';
 return 'line';
}
function buildScene(sc,T){
 const th=THEMES[sc.look.theme],F=FONTS[sc.look.font];
 const keep=[];sc.blocks.forEach((b,i)=>{if(!T.drop.includes(i))keep.push(i);});
 const tm=computeTimes(sc.blocks,T,keep);
 const flow=keep.filter(i=>sc.blocks[i].role!=='cta');
 const ctaIdx=keep.find(i=>sc.blocks[i].role==='cta');
 let lname=sc.look.layout;if(lname==='split'&&flow.length<2)lname='center';
 const LY=LAYOUTS[lname];
 const mx=LY.mx,textLeft=LY.bar?mx+22:mx;
 const maxW=LY.align==='center'?W-2*mx:W-textLeft-mx;
 let top0=150,bot0=690;if(LY.glyph)top0+=50;
 const areaH=bot0-top0;
 let res=null,total=0;
 for(let s=1;s>=.42;s-=.04){
  res=flow.map(i=>measureBlock(sc.blocks[i],s,F,maxW));
  total=res.reduce((a,r,k)=>a+r.h+(k<res.length-1?r.gap:0),0);
  if(total<=areaH)break;
 }
 let top=LY.anchor==='lower'?bot0-total:LY.anchor==='upper'?top0+20:top0+(areaH-total)/2-10;
 const items=[];let y=top;
 res.forEach((r,k)=>{
  const i=flow[k],b=sc.blocks[i];
  const mode=modeFor(b.role,sc.look.anim);
  const appear=tm.appear[i];
  const span=(tm.ends[i]!=null&&tm.starts[i]!=null)?Math.max(.6,(tm.ends[i]-tm.starts[i])*.82):.8;
  const it={idx:i,role:b.role,mode,appear,top:y,h:r.h,font:r.font,size:r.size,ls:r.ls,tokens:[],lines:r.lines.length};
  ctx.font=r.font;ls(r.ls);
  const lineInfo=r.lines.map((ln,li)=>{
   const w=ctx.measureText(ln).width;
   const x0=LY.align==='center'?W/2-w/2:textLeft;
   const cyL=y+(b.cd&&r.lines.length*r.lh<r.h?(r.h-r.lines.length*r.lh)/2:0)+li*r.lh+r.lh/2;
   return {ln,w,x0,cy:cyL};
  });
  const unit=(isDisp(b.role)&&(mode==='typewriter'||mode==='drop'))?'char':(mode==='wordpop'||mode==='sync')?'word':'line';
  const bcx=lineInfo.reduce((a,l)=>a+l.x0+l.w/2,0)/lineInfo.length,bcy=y+r.h/2;
  const raw=[];
  lineInfo.forEach((L,li)=>{
   if(unit==='line'){raw.push({t:L.ln,x:L.x0,y:L.cy,w:L.w,li});}
   else if(unit==='word'){let pos=0;L.ln.split(' ').forEach(wd=>{const ix=L.ln.indexOf(wd,pos);const px=ctx.measureText(L.ln.slice(0,ix)).width;raw.push({t:wd,x:L.x0+px,y:L.cy,w:ctx.measureText(wd).width,li});pos=ix+wd.length;});}
   else{for(let c=0;c<L.ln.length;c++){const ch=L.ln[c];if(ch===' ')continue;const px=ctx.measureText(L.ln.slice(0,c)).width;raw.push({t:ch,x:L.x0+px,y:L.cy,w:ctx.measureText(ch).width,li});}}
  });
  const n=raw.length;
  raw.forEach((tk,q)=>{
   let delay=0;
   if(mode==='sync')delay=(q/Math.max(1,n))*span;
   else if(mode==='wordpop')delay=q*Math.min(.14,1/Math.max(1,n));
   else if(mode==='typewriter'||mode==='drop')delay=q*Math.min(.05,1.3/Math.max(1,n));
   else if(mode==='slide'||mode==='line')delay=tk.li*.16;
   else delay=tk.li*.05;
   tk.start=appear+delay;tk.mode=mode;
   if(mode==='blur'||mode==='zoom'){tk.ox=bcx;tk.oy=bcy;}else{tk.ox=tk.x+tk.w/2;tk.oy=tk.y;}
   it.tokens.push(tk);
  });
  ls(0);
  items.push(it);y+=r.h+r.gap;
 });
 /* events (sound effects) */
 const ev=[{t:.1,k:'chime'}];
 items.forEach(it=>{
  if(it.mode==='wordpop'&&(it.role==='head'||it.role==='answer')){it.tokens.forEach(tk=>ev.push({t:tk.start,k:'pop'}));}
  else if(it.role==='answer')ev.push({t:it.appear,k:'ding'});
  else if(it.role==='head'||it.role==='bigquote'||it.role==='question')ev.push({t:it.appear,k:'whoosh'});
 });
 /* countdown window for quiz style scenes */
 let cd=null;
 const ai=items.find(it=>it.role==='answer'&&sc.blocks[it.idx].cd);
 if(ai){
  let pe=.8;keep.forEach(i=>{if(i<ai.idx&&tm.ends[i]!=null)pe=Math.max(pe,tm.ends[i]);});
  cd={s:pe+.2,e:ai.appear,cx:W/2,cy:ai.top+ai.h/2};
  if(cd.e-cd.s<1.2)cd.s=Math.max(.5,cd.e-1.5);
  for(let q=0;q<3;q++)ev.push({t:cd.s+q*(cd.e-cd.s)/3,k:'tick'});
 }
 const cta=ctaIdx!=null?{text:sc.blocks[ctaIdx].text,appear:tm.appear[ctaIdx]}:null;
 if(cta)ev.push({t:cta.appear,k:'whoosh'});
 ev.sort((a,b)=>a.t-b.t);
 return {th,F,look:sc.look,label:sc.label,layout:LY,lname,items,top,total,cd,cta,events:ev,evIdx:0,
         duration:T.total,phase:sc.phase,mx,textLeft};
}

/* ===== text animation ===== */
function animVals(mode,tl){
 const c=clamp;
 switch(mode){
  case 'wordpop':{const p=c(tl/.4);return {a:c(tl/.1),s:.3+.7*easeBack(p),dy:(1-easeOut(p))*30,b:0};}
  case 'typewriter':return {a:c(tl/.05),s:1,dy:0,b:0};
  case 'slide':{const p=c(tl/.5);return {a:p,s:1,dy:(1-easeOut(p))*60,b:0};}
  case 'blur':{const p=c(tl/.9);return {a:easeOut(p),s:1.12-.12*easeOut(p),dy:0,b:(1-easeOut(p))*16};}
  case 'drop':{const p=c(tl/.55);return {a:c(tl/.08),s:1,dy:-(1-easeBounce(p))*150,b:0};}
  case 'zoom':{const p=c(tl/.65);return {a:c(tl/.25),s:2.2-1.2*easeBack(p),dy:0,b:0};}
  case 'sync':{return {a:c(tl/.25),s:1,dy:(1-easeOut(tl/.35))*14,b:0};}
  default:{const p=c(tl/.45);return {a:p,s:1,dy:(1-easeOut(p))*24,b:0};}
 }
}

/* ===== audio ===== */
let AC=null,master=null,recDest=null,pad=null;
function initAudio(){
 if(AC)return;
 try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);}catch(e){AC=null;}
}
function tone(f0,f1,d,vol,type){
 if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
 o.frequency.setValueAtTime(f0,n);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,n+d);
 g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.05);
}
function whoosh(){
 if(!AC)return;const n=AC.currentTime,d=.4,len=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,len,AC.sampleRate),x=buf.getChannelData(0);
 for(let i=0;i<len;i++)x[i]=Math.random()*2-1;
 const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;
 f.frequency.setValueAtTime(400,n);f.frequency.exponentialRampToValueAtTime(3200,n+d);
 const g=AC.createGain();g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.22,n+d*.45);g.gain.linearRampToValueAtTime(0,n+d);
 s.connect(f);f.connect(g);g.connect(master);s.start(n);
}
function sfx(k){
 if(!AC)return;
 if(k==='pop')tone(760,320,.1,.16);
 else if(k==='whoosh')whoosh();
 else if(k==='tick')tone(1000,900,.07,.2);
 else if(k==='ding'){tone(1318,1318,.9,.2);tone(1976,1976,.6,.08);}
 else if(k==='chime'){tone(880,880,.5,.1);tone(1320,1320,.7,.07);}
}
function startPad(){
 stopPad();if(!AC)return;
 const root=pick([174.6,196,220,233.1,261.6]);const ratios=[1,1.26,1.5,2];
 pad=ratios.map((r,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=root*r;const n=AC.currentTime;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.03-i*.005,n+1.5);o.connect(g);g.connect(master);o.start(n);return {o,g};});
}
function stopPad(){if(!pad)return;pad.forEach(p=>{try{p.g.gain.setTargetAtTime(0,AC.currentTime,.25);p.o.stop(AC.currentTime+1);}catch(e){}});pad=null;}

/* ===== drawing ===== */
let playing=false,t0=null,idleTheme=THEMES[Math.floor(Math.random()*THEMES.length)],idleStart=performance.now();

function drawToken(tk,it,C,t){
 const tl=t-tk.start;if(tl<0)return;
 const v=animVals(tk.mode,tl);if(v.a<=.003)return;
 const acc=C.th.accent;
 ctx.save();
 ctx.globalAlpha=clamp(v.a);
 ctx.translate(tk.ox,tk.oy+v.dy);ctx.scale(v.s,v.s);ctx.translate(-tk.ox,-tk.oy);
 if(v.b>.3)ctx.filter='blur('+v.b.toFixed(1)+'px)';
 ctx.font=it.font;ls(it.ls);ctx.textBaseline='middle';ctx.textAlign='left';
 ctx.lineJoin='round';ctx.lineWidth=Math.max(2.5,it.size*.1);ctx.strokeStyle='rgba(0,0,0,.42)';
 ctx.strokeText(tk.t,tk.x,tk.y);
 const colored=it.role==='answer'||it.role==='ref'||it.role==='tag';
 ctx.fillStyle=colored?acc:(it.role==='body'?'rgba(255,255,255,.96)':'#fff');
 if(isDisp(it.role)&&it.tokens.length<40){ctx.shadowColor=colored?acc:'rgba(255,255,255,.6)';ctx.shadowBlur=14;}
 ctx.fillText(tk.t,tk.x,tk.y);
 ls(0);ctx.restore();
}
function drawScene(t){
 const C=CUR,acc=C.th.accent,F=C.F,LY=C.layout;
 if(playing){while(C.evIdx<C.events.length&&C.events[C.evIdx].t<=t){sfx(C.events[C.evIdx].k);C.evIdx++;}}
 const first=C.items[0];
 /* label pill */
 const lp=easeOut((t-.1)/.45);
 if(lp>0){ctx.save();ctx.globalAlpha=lp;ctx.font='700 15px '+F.b;ls(5);const w=ctx.measureText(C.label).width+48;const x=W/2-w/2,y=88;
  rr(x,y,w,34,17);ctx.fillStyle='rgba(0,0,0,.3)';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=acc;ctx.stroke();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(C.label,W/2+2,y+17.5);ls(0);ctx.restore();}
 if(first){
  const p=easeOut((t-first.appear)/.55);
  if(p>0){
   if(LY.card){ctx.save();ctx.globalAlpha=p;const px=C.mx-24,py=C.top-34,pw=W-2*px,ph=C.total+68;ctx.translate(W/2,py+ph/2);ctx.scale(.94+.06*p,.94+.06*p);ctx.translate(-W/2,-(py+ph/2));
    rr(px,py,pw,ph,26);ctx.fillStyle='rgba(0,0,0,.34)';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=acc;ctx.globalAlpha=p*.6;ctx.stroke();ctx.restore();}
   if(LY.bar){ctx.save();ctx.fillStyle=acc;ctx.globalAlpha=.95;ctx.fillRect(C.mx-2,C.top,5,C.total*p);ctx.restore();}
   if(LY.glyph){ctx.save();ctx.globalAlpha=.28*p;ctx.fillStyle=acc;ctx.font='900 170px '+F.d;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('\u201C',W/2,C.top-12);ctx.restore();}
   if(LY.ornament){crossShape(W/2,C.top-58,30,acc,.85*p);}
   if(LY.divider&&C.items[1]){const yy=first.top+first.h+(ROLE[first.role].gap)/2,q=easeOut((t-C.items[1].appear+.2)/.5);if(q>0){ctx.save();ctx.strokeStyle=acc;ctx.lineWidth=2;ctx.globalAlpha=.9;ctx.beginPath();ctx.moveTo(W/2-70*q,yy);ctx.lineTo(W/2+70*q,yy);ctx.stroke();ctx.restore();}}
  }
 }
 C.items.forEach(it=>{it.tokens.forEach(tk=>drawToken(tk,it,C,t));});
 /* countdown ring */
 if(C.cd&&t>=C.cd.s&&t<C.cd.e){
  const p=(t-C.cd.s)/(C.cd.e-C.cd.s),num=3-Math.min(2,Math.floor(p*3)),frac=(p*3)%1,pulse=1+.18*Math.pow(1-frac,3);
  ctx.save();ctx.translate(C.cd.cx,C.cd.cy);
  ctx.lineWidth=7;ctx.strokeStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(0,0,42,0,TAU);ctx.stroke();
  ctx.strokeStyle=acc;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,42,-Math.PI/2,-Math.PI/2+TAU*(1-p));ctx.stroke();
  ctx.scale(pulse,pulse);ctx.font='900 46px '+F.d;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.strokeText(String(num),0,2);ctx.fillStyle='#fff';ctx.fillText(String(num),0,2);
  ctx.restore();
 }
 /* call to action pill */
 if(C.cta){
  const p=easeBack((t-C.cta.appear)/.5);
  if(p>0){ctx.save();ctx.globalAlpha=clamp(p);ctx.font='800 22px '+F.b;ls(1);const w=ctx.measureText(C.cta.text).width+56,x=W/2-w/2,y=722+(1-clamp(p))*40;
   rr(x,y,w,48,24);ctx.fillStyle=acc;ctx.fill();ctx.fillStyle='#1a1020';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(C.cta.text,W/2+.5,y+25);ls(0);ctx.restore();}
 }
}
function drawSplash(t){
 const th=idleTheme;ctx.save();
 ctx.font='900 64px "Cinzel",Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.shadowColor=th.accent;ctx.shadowBlur=20;
 ctx.fillText('BIBLE',W/2,H/2-40);ctx.fillText('SHORTS',W/2,H/2+30);ctx.shadowBlur=0;
 ctx.font='600 18px "Raleway",Arial,sans-serif';ls(4);ctx.fillStyle=th.accent;ctx.fillText('TAP TO PLAY A SAMPLE',W/2,H/2+110);ls(0);ctx.restore();
}
function render(t,bgT){
 ctx.setTransform(K,0,0,K,0,0);ctx.clearRect(0,0,W,H);
 const th=CUR?CUR.th:idleTheme;th.bg(bgT);scrim();
 if(CUR){drawScene(t);const dur=CUR.duration;let f=0;if(t<.3)f=1-t/.3;else if(t>dur-.45)f=clamp((t-(dur-.45))/.45);if(f>0){ctx.fillStyle='rgba(0,0,0,'+f+')';ctx.fillRect(0,0,W,H);}}
 else drawSplash(t);
}

/* ===== recording ===== */
let recorder=null,recChunks=[],recording=false;
window._recordingDone=false;window._recordingBlob=null;
function startRec(fps){
 initAudio();if(AC)AC.resume().catch(()=>{});
 let tracks=[];
 const vs=cv.captureStream(fps||30);tracks=tracks.concat(vs.getVideoTracks());
 if(AC){recDest=AC.createMediaStreamDestination();master.connect(recDest);tracks=tracks.concat(recDest.stream.getAudioTracks());}
 const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
 recChunks=[];recorder=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:6000000,audioBitsPerSecond:128000});
 recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)recChunks.push(e.data);};
 recorder.onstop=()=>{try{if(recDest)master.disconnect(recDest);}catch(e){}window._recordingBlob=new Blob(recChunks,{type:'video/webm'});window._recordingDone=true;};
 recorder.start(200);recording=true;
}
window.getRecordingBase64=function(){
 return new Promise((resolve,reject)=>{const chk=()=>{if(!window._recordingBlob){setTimeout(chk,100);return;}const r=new FileReader();r.onloadend=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(window._recordingBlob);};chk();});
};

/* ===== public API ===== */
window.prepareScene=function(o){
 S=makeScene(o);
 const head=S.blocks.find(b=>b.role==='head'||b.role==='question'||b.role==='bigquote'||b.role==='tag');
 window._lastCategory=S.type;window._lastHeadline=head?head.text:'';
 return {
  type:S.type,caption:S.caption,label:S.label,
  look:{theme:THEMES[S.look.theme].id,layout:S.look.layout,anim:S.look.anim,font:FONTS[S.look.font].n},
  speech:S.blocks.map((b,i)=>b.speak?{i:i,text:b.speak,gap:b.gap||0,optional:!!b.optional}:null).filter(Boolean)
 };
};
window.playScene=function(timing,opts){
 opts=opts||{};
 if(!S)window.prepareScene();
 const T={starts:timing.starts||{},ends:timing.ends||{},drop:timing.drop||[],total:Math.min(14.8,timing.total||12)};
 CUR=buildScene(S,T);
 initAudio();if(AC){AC.resume().catch(()=>{});}
 window._recordingDone=false;window._recordingBlob=null;
 if(opts.record)startRec(opts.fps||30);
 startPad();
 playing=true;t0=null;
 document.getElementById('hint').style.opacity=0;
};
window.renderAt=function(t){playing=false;if(!CUR)return;render(t,t+CUR.phase);};
window.stopRecording=function(){try{if(recorder&&recorder.state!=='inactive')recorder.stop();}catch(e){}recording=false;};
window.forceFinalize=function(){if(recChunks.length&&!window._recordingDone){window._recordingBlob=new Blob(recChunks,{type:'video/webm'});window._recordingDone=true;}};

/* preview timing (no voice): estimate about 2.5 words per second */
function estimateTiming(sp){
 const T={starts:{},ends:{},drop:[],total:0};let cur=.8;
 sp.speech.forEach(s=>{const dur=s.text.split(/\s+/).length/2.5+.3;const st=cur+s.gap;T.starts[s.i]=st;T.ends[s.i]=st+dur;cur=st+dur+.3;});
 T.total=Math.min(14.5,cur+1.0);return T;
}
function previewNext(){
 let sp=window.prepareScene(),T=estimateTiming(sp),tries=0;
 while(T.total>14.4&&tries<8){const opt=sp.speech.find(s=>s.optional);if(opt){const k=sp.speech.indexOf(opt);sp.speech.splice(k,1);T.drop=[opt.i];T.total=Math.min(14.5,T.total-1.2);if(T.total<=14.4)break;}sp=window.prepareScene();T=estimateTiming(sp);tries++;}
 window.playScene(T,{record:false});
}
document.getElementById('stage').addEventListener('click',()=>{if(!window._ci)previewNext();});

/* ===== main loop ===== */
function loop(now){
 requestAnimationFrame(loop);
 if(playing){
  if(t0===null)t0=now;
  const t=(now-t0)/1000;
  render(t,t+CUR.phase);
  if(t>=CUR.duration+.1){
   playing=false;stopPad();
   if(recording)window.stopRecording();
   document.getElementById('hint').style.opacity=1;
  }
 }else if(!CUR){
  render((now-idleStart)/1000,(now-idleStart)/1000);
 }
}
/* wait for fonts so canvas text measures correctly */
const fontJobs=[];
FONTS.forEach(f=>{fontJobs.push(document.fonts.load(f.dw+' 40px '+f.d));fontJobs.push(document.fonts.load(f.bw+' 24px '+f.b));});
Promise.race([Promise.all(fontJobs),new Promise(r=>setTimeout(r,6000))]).then(()=>{window._ready=true;}).catch(()=>{window._ready=true;});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
